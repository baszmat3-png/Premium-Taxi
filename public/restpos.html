<!DOCTYPE html>
<html lang="ar" dir="rtl" data-app="restpos"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#15181e">
<title>جهاز طلبات المطعم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script><script src="shared.js"></script>
<style>
:root{--ink:#15181e;--ink2:#222833;--ink3:#2f3644;--bg:#e6e9ef;--paper:#fff;--line:#d8dde6;--tx:#161a21;--mu:#6a7484;--or:#ff6a00;--or2:#fff1e7;--bl:#2457f5;--bl2:#e8eeff;--gr:#0c9a62;--gr2:#e2f6ec;--rd:#df382d;--rd2:#fdeceb;--am:#f0a500;--am2:#fff5d9;--f:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
header.tb{display:none!important}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none}
input,button,select{font:inherit;color:inherit}input{-webkit-user-select:text;user-select:text}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
#app{height:100%;display:flex}
/* ---------- الشريط الجانبي ---------- */
.rail{width:96px;background:var(--ink);color:#c5ccd8;display:flex;flex-direction:column;align-items:stretch;padding:14px 8px calc(14px + env(safe-area-inset-bottom,0px));gap:6px;flex:none}
.logo{height:56px;margin:0 4px 10px;border-radius:16px;background:var(--or);display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:16px;font-size:13px;font-weight:700;color:#aeb7c6;transition:background .15s}
.nv i{font-style:normal;font-size:26px;line-height:1.1}
.nv:hover{background:var(--ink2)}.nv.a{background:var(--paper);color:var(--ink)}
.nv .bd{position:absolute;top:6px;inset-inline-start:10px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--rd);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.rail .sp{flex:1}
/* ---------- الشريط العلوي ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;background:var(--paper);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.top h1{margin:0;font-size:21px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;border-radius:99px;font-weight:800;font-size:15px;border:2px solid transparent}
.pill i{width:12px;height:12px;border-radius:50%;background:currentColor}
.pill small{font-weight:600;opacity:.8;font-size:13px}
.pill.on{background:var(--gr2);color:var(--gr)}.pill.busy{background:var(--am2);color:#9a6700}.pill.pause{background:var(--bl2);color:var(--bl)}.pill.off{background:#e9ebf0;color:#4a5262}
.top .g{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:#eef0f4;font-weight:700;font-size:14px;white-space:nowrap}

.ib{width:46px;height:46px;border-radius:14px;background:#eef0f4;font-size:21px;display:inline-grid;place-items:center}.ib.off{opacity:.45}
.clk{font-weight:800;font-size:18px;min-width:78px;text-align:center;font-variant-numeric:tabular-nums}

#alert.on{display:block;animation:bl 1s steps(2,jump-none) infinite}
@keyframes bl{50%{background:#d94f00}}
#pg{flex:1;min-height:0;overflow:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px))}

.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;height:100%}
.col{display:flex;flex-direction:column;min-height:0;background:#d9dde6;border-radius:20px;padding:10px}

.col.nw h2 b{background:var(--or)}.col.pr h2 b{background:var(--bl)}.col.rd h2 b{background:var(--gr)}
.cb{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:2px 2px 8px}
.emp{margin:40px 10px;text-align:center;color:var(--mu);font-weight:600}
@media(max-width:980px){.cols{grid-template-columns:1fr;height:auto}.col{min-height:auto}.cb{overflow:visible}body{overflow:auto}#app{height:auto;min-height:100%}#pg{overflow:visible}}

.tk{--c:var(--or);background:var(--paper);border-radius:16px 16px 0 0;overflow:hidden;padding-bottom:14px;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%}

.seg{display:inline-flex;background:#d6dae3;border-radius:14px;padding:4px;gap:2px}

.cgh{display:flex;align-items:center;gap:10px;margin:18px 2px 8px}.cgh h3{margin:0;font-size:19px;font-weight:900}.cgh .g{flex:1}

.ir{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.ir.dim{background:#f1f2f5}.ir.dim .em,.ir.dim .nmx{opacity:.5}
.ir .em{width:54px;height:54px;border-radius:14px;background:#eef0f4;display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none}.ir .em img{width:100%;height:100%;object-fit:cover}
.ir .g{flex:1;min-width:0}.ir .nmx{font-weight:800;font-size:17px;display:block}.ir small{color:var(--mu);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stt{font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}.stt.on{background:var(--gr2);color:var(--gr)}.stt.off{background:var(--rd2);color:var(--rd)}.stt.time{background:var(--am2);color:#9a6700}
.sw{width:64px;height:36px;border-radius:99px;background:#c3c9d4;position:relative;flex:none;transition:background .15s}.sw i{position:absolute;top:4px;inset-inline-start:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:inset-inline-start .15s}
.sw.on{background:var(--gr)}.sw.on i{inset-inline-start:32px}
@media(max-width:760px){.mn{grid-template-columns:1fr}.crl{position:static;flex-direction:row;overflow:auto}.crl button{white-space:nowrap}}
/* ---------- السجل ---------- */
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--paper);border-radius:18px;padding:14px 16px}.k small{display:block;color:var(--mu);font-weight:700}.k b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}.k.big{background:var(--ink);color:#fff}.k.big small{color:#aeb7c6}.k.big b{font-size:28px;color:#fff}
.k em{font-style:normal;font-size:13px;color:var(--mu);font-weight:700}.k.big em{color:#aeb7c6}
.card{background:var(--paper);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:17px;font-weight:900}
.tbl{width:100%;border-collapse:collapse;background:var(--paper);border-radius:18px;overflow:hidden}
.tbl th{background:#eef0f4;font-size:13px;color:var(--mu);font-weight:800;text-align:start;padding:10px 12px;position:sticky;top:0}
.tbl td{padding:12px;border-top:1px solid var(--line);font-weight:700;vertical-align:middle}
.tbl tr.r{cursor:pointer}.tbl tr.r:hover td{background:#f6f8fc}
.tbl .no{font-weight:900;direction:ltr;display:inline-block}
.tbw{overflow-x:auto;border-radius:18px}
.st{color:#f0a500;letter-spacing:1px;white-space:nowrap}.st i{font-style:normal;color:#d4d8e0}
.top3{display:flex;flex-direction:column;gap:6px}.top3 div{display:flex;gap:10px;align-items:center}.top3 .bar2{height:10px;border-radius:99px;background:var(--or);min-width:6px}.top3 span{white-space:nowrap;font-weight:700}
/* ---------- الإعدادات ---------- */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row .g{flex:1}.row b{display:block;font-weight:800}.row small{color:var(--mu);font-weight:600}
.stp{display:inline-flex;align-items:center;gap:6px}.stp button{width:44px;height:44px;border-radius:12px;background:#eef0f4;font-size:22px;font-weight:900}.stp output{min-width:54px;text-align:center;font-weight:900;font-size:19px}
input[type=range]{width:160px;accent-color:var(--or)}
/* ---------- النوافذ ---------- */
#md{position:fixed;inset:0;display:none;background:#0b0e14b8;z-index:50;align-items:center;justify-content:center;padding:16px}#md.on{display:flex}
.mc{background:var(--paper);border-radius:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column}.mc.wide{max-width:900px;height:min(86vh,720px)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}.mh b{font-size:19px;font-weight:900;flex:1}.mh small{color:var(--mu);font-weight:600;display:block;font-size:14px}
.cx{width:42px;height:42px;border-radius:12px;background:#eef0f4;font-size:18px;font-weight:900}
.mb{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.op{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#f2f4f8;text-align:start;font-weight:800;font-size:17px;width:100%}
.op i{font-style:normal;font-size:26px}.op small{display:block;font-weight:600;color:var(--mu);font-size:14px}.op.sel{outline:3px solid var(--gr);background:var(--gr2)}.op.dn{color:var(--rd);background:var(--rd2)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chips button{height:58px;border-radius:14px;background:#eef0f4;font-weight:900;font-size:20px}.chips button small{display:block;font-size:11px;font-weight:700;color:var(--mu);margin-top:-6px}.chips button.sg2{background:var(--or);color:#fff}.chips button.sg2 small{color:#ffe3d0}
.cu{display:flex;gap:8px}.cu input{flex:1;height:52px;border-radius:14px;border:1px solid var(--line);padding:0 14px;font-size:18px;font-weight:700}
.mapbox{flex:1;min-height:320px;position:relative;background:#dfe3ea}
.mf{padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}.mf b{font-weight:900}
.dt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-weight:700}.dt small{display:block;color:var(--mu);font-weight:700;font-size:12px}
.tl2{display:flex;flex-wrap:wrap;gap:6px}.tl2 span{background:#f0f2f6;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700}
.tt{display:flex;justify-content:space-between;padding:4px 0;font-weight:700}.tt.f{font-size:19px;font-weight:900;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
#ts{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:99}#ts span{background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-weight:800;box-shadow:0 8px 24px #0005}
/* ---------- الدخول وبدء الوردية ---------- */
.lg{height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--ink),#272f3d)}
.lgc{width:min(440px,100%);background:var(--paper);border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:12px}.lgc h1{margin:0;font-size:26px;font-weight:900}.lgc p{margin:0 0 6px;color:var(--mu);font-weight:600}
.lgc input{height:56px;border-radius:14px;border:1px solid var(--line);padding:0 16px;font-size:18px;font-weight:700}
.shift{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,var(--ink),#272f3d);display:grid;place-items:center;text-align:center;color:#fff;padding:24px}
.shift h2{font-size:30px;font-weight:900;margin:8px 0}.shift p{color:#aeb7c6;font-weight:600;max-width:420px;margin:0 auto 22px}.shift .b{max-width:340px;margin:auto;min-height:64px;font-size:21px}
</style></head>
<body>
<div id="app"></div><div id="md"></div><div id="ts"></div>
<script>
auth('rest');
const ST={pg:'o',snd:localStorage.rp_snd!=='0',vol:+(localStorage.rp_vol||.9),ap:localStorage.rp_ap==='1',pw:localStorage.rp_pw||'80',hv:'day',hd:'',vw:'brief',q:'',cat:'*',fl:'all',seen:null,on:0,trk:null,durL:[],durCb:null};
let ac=null;
const mny=n=>Number(Math.round(n||0)).toLocaleString('en-US')+' د.ع';
const R=()=>DB.rests[AUTH.id]||{items:[]},
 hm=t=>new Date(t).toLocaleTimeString('ar-IQ-u-nu-latn',{hour:'numeric',minute:'2-digit'}),
 hd=t=>new Date(t).toLocaleDateString('ar-IQ-u-nu-latn',{weekday:'long',day:'numeric',month:'long'}),
 sub=o=>(o.its||[]).reduce((s,i)=>s+i.q*i.p,0),net=o=>sub(o)-(o.disc||0),
 num=o=>'#'+String(o.id).slice(-5),age=o=>Math.max(0,Math.floor((Date.now()-o.at)/6e4)),
 dayEnd=()=>{const d=new Date();d.setHours(5,0,0,0);if(d<=Date.now())d.setDate(d.getDate()+1);return +d},
 dayStart=off=>{const d=new Date();d.setHours(5,0,0,0);if(d>Date.now())d.setDate(d.getDate()-1);d.setDate(d.getDate()-(off||0));return +d},
 nNew=()=>Object.values(DB.orders||{}).filter(o=>o.st==0).length,
 payT=o=>o.paid||o.pay=='wallet'?'محفظة (مدفوع)':'نقدًا',
 cat=i=>i.cat||'',cn=c=>c||'القائمة',cs=c=>(R().cs||{})[c]||{},
 bzOn=r=>r.bz==1||r.bz>Date.now();
const rSt=r=>!r.open?['off','مغلق','حتى تعيد فتحه']:r.pu>Date.now()?['pause','مغلق مؤقتًا','حتى '+hm(r.pu)]:bzOn(r)?['busy','مشغول',r.bz==1?'حتى تعيد فتحه':'حتى '+hm(r.bz)]:['on','مفتوح','يستقبل الطلبات'];
const stTxt=o=>o.st<0?['x','ملغي']:o.st==4?['ok','تم التوصيل']:o.st==3?['bl','مع المندوب']:o.st==2?['gr','جاهز']:o.st==1?['pr','قيد التحضير']:['nw','جديد'];
const stars=n=>n>0?`<span class="st">${'★'.repeat(n)}<i>${'★'.repeat(5-n)}</i></span>`:'<span style="color:var(--mu)">—</span>';
function toast(t){const e=$('#ts');e.innerHTML=`<span>${esc(t)}</span>`;clearTimeout(toast.t);toast.t=setTimeout(()=>e.innerHTML='',2600)}
/* ---------- الصوت ---------- */
