<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جارٍ إعادة الاتصال</title>

<script>(function t(){fetch('/healthz',{cache:'no-store'}).then(function(r){if(r.ok)location.replace(location.pathname=='/offline.html'?'/':location.href);else setTimeout(t,4000)}).catch(function(){setTimeout(t,4000)})})()</script></body></html>
