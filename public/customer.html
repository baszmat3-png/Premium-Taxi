<!DOCTYPE html>
<html lang="ar" dir="rtl" data-app="customer"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تكسي المتميز - طعام وتكسي</title>
<link rel="stylesheet" href="shared.css"><script src="config.js"></script><script src="shared.js"></script><style>
[data-app=customer]{--pr:#1f4fff;--pt:#fff}@media(prefers-color-scheme:dark){[data-app=customer]{--pr:#7d97ff;--pt:#050a24}}
[data-app=customer] .tb{display:none}
.fh{display:flex;gap:10px;align-items:center;margin:2px 0 14px}.pill{background:var(--cd);border:1px solid var(--bd);border-radius:999px;min-height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:700;box-shadow:var(--sh);color:var(--tx);cursor:pointer;white-space:nowrap}.pill.c{width:48px;padding:0;justify-content:center;font-size:20px;flex:none}.pill.g{flex:1;min-width:0;overflow:hidden}.brand{font-weight:800;font-size:22px;color:var(--pr);font-style:italic}
.sq{margin:0 0 12px;border-radius:999px}
.bn{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}.bn>div{flex:none;width:62%;max-width:290px;height:210px;border-radius:24px;padding:18px;color:#fff;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden}.bn small{font-weight:700;opacity:.9}.bn strong{font-size:60px;line-height:1;font-weight:800}.bn b{font-size:18px}.b0{background:#0b1220}.b1{background:#1f4fff}.b2{background:#f6ede1;color:#0f1f21!important}.b3{background:#e8412c}
.cats{background:var(--cd);border:1px solid var(--bd);border-radius:26px;padding:16px;margin:12px 0}.cats h2{margin:0 0 12px}.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:13px;font-weight:600}.cg div{cursor:pointer}.cg span{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 4px;border-radius:50%;background:var(--bg);font-size:30px;box-shadow:var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;scrollbar-width:none}.chips button{background:var(--cd);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}.chips button.a{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.dk{background:#0b1220;border-radius:28px;padding:14px;margin:12px 0;color:#fff}.dk .row{margin-bottom:10px}.dk h2{margin:0;color:#fff}.dk button{background:transparent;border:1.5px solid #fff;color:#fff}
.rr{display:flex;gap:12px;align-items:center;background:var(--cd);color:var(--tx);border-radius:22px;padding:10px;margin:10px 0;cursor:pointer;border:1px solid var(--bd)}.rr:active{transform:scale(.985)}.lg2{position:relative;flex:none}.lg2 .em{width:84px;height:84px;border-radius:18px}.bd{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--pr);color:var(--pt);font-weight:800;font-size:13px;padding:2px 9px;border-radius:99px;border:2px solid var(--cd)}
[data-app=customer] nav{inset-inline:0;bottom:0;max-width:none;border-radius:0;border-width:1px 0 0;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));background:var(--cd);box-shadow:0 -4px 18px rgba(0,0,0,.06)}
[data-app=customer] nav button{position:relative;flex-direction:column;gap:2px;font-size:12px;min-height:50px;border-radius:12px;background:none;color:var(--tx);font-weight:600;padding:4px}nav button i{font-style:normal;font-size:22px;line-height:1.2}nav button.a{background:none;color:var(--pr)}nav u{position:absolute;top:0;inset-inline-end:22%;text-decoration:none;background:#e8412c;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:800}
.lgn{text-align:center;padding-top:8vh}.lgn .brand{font-size:44px}.or{color:var(--mu);margin:14px 0}#gb{display:flex;justify-content:center;min-height:44px}

.tx{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}.tx .mp{flex:1;position:relative;min-height:0}.tx #tmap{position:absolute;inset:0}
.pin{position:absolute;left:50%;top:50%;z-index:3;pointer-events:none;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}.pin b{width:34px;height:34px;border-radius:50%;background:#f26b1d;border:8px solid #fff;box-shadow:0 3px 10px #0004;box-sizing:border-box}.pin:after{content:"";width:3px;height:16px;background:#33383f}.pin.d b{border-radius:9px;background:#1f4fff}
.fb{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));z-index:4;width:46px;height:46px;min-height:0;padding:0;border-radius:50%;background:var(--cd);color:var(--tx);border:0;box-shadow:0 3px 12px #0003;font-size:20px;display:grid;place-items:center}.fb[style*=bottom]{top:auto}
.sh{background:var(--cd);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 26px #0002;max-height:62vh;overflow:auto;z-index:5}
.ad{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:12px 14px;margin:0 0 8px;font-weight:700}.ad span{flex:1;min-width:0}.dot{flex:none;width:14px;height:14px;border-radius:50%;background:#f26b1d}.dot.b{border-radius:4px;background:#1f4fff}.sm{min-height:34px;padding:0 12px;font-size:13px}
.rs{padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer}.cl{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1.5px solid transparent;margin:4px 0;cursor:pointer}.cl.a{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 9%,transparent)}.ci{font-size:30px}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--bd);border-top-color:var(--pr);animation:rt 1s linear infinite;margin:6px auto 12px}@keyframes rt{to{transform:rotate(360deg)}}
</style></head>
<body><div id="app"><div id="v"></div><div id="tm" class="map" hidden></div></div>
<nav><button data-t="home" onclick="go('home')"><i>🏠</i>الرئيسية</button><button data-t="orders" onclick="go('orders')"><i>📦</i>الطلبات</button><button data-t="cart" onclick="go('cart')"><i>🛒</i><u id="cb" hidden>0</u>السلة</button><button data-t="offers" onclick="go('offers')"><i>🏷️</i>القسائم</button><button data-t="acct" onclick="go('acct')"><i>👤</i>الحساب</button></nav>
<script>
const CID=localStorage.cid||'';
AUTH={role:'customer',id:CID,token:localStorage.tok||''};
let P=JSON.parse(localStorage.p||'{}'),view='home',rid=null,cart={},loc=null,ctl=null,rp={},first=1;
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const sub=()=>(DB.rests[rid].items||[]).reduce((s,i)=>s+(cart[i.id]||0)*i.p,0);
const bestOf=()=>Object.values(DB.offers||{}).filter(o=>o.on!==0&&o.pct&&(!o.rid||o.rid==rid)).sort((a,b)=>b.pct-a.pct)[0],dsc=()=>{const o=bestOf();return o?Math.round(sub()*o.pct/100):0};
const feeF=(r,l)=>{const c=DB.cfg;return Math.max(c.min,Math.round((c.base+(r.loc&&l?dist(r.loc,l)*1.3*c.foodKm:0))/250)*250)};
const go=v=>{view=v;draw();scrollTo(0,0)};
const ad=(id,d)=>{cart[id]=Math.max(0,(cart[id]||0)+d);draw()};
function draw(){if(!AUTH.token)return login($('#v'));$('#tm').hidden=1;const M={food:'home',menu:'home',co:'cart',taxi:'home',join:'acct',cards:'acct'};document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('a',b.dataset.t==(M[view]||view)));const cb=$('#cb');cb.textContent=cnt();cb.hidden=!cnt();({home,food,menu,co,cart:cartv,taxi,orders,offers,cards,acct,join})[view]($('#v'))}
function rc(r,pc){return `<div class="rr rc" data-s="${esc(r.n+' '+(r.c||'')+' '+(r.items||[]).map(i=>i.n).join(' '))}" onclick="rid='${r.id}';cart={};go('menu')"><div class="lg2">${pic(r)}${pc?`<span class="bd">${pc}%</span>`:''}</div><div class="g"><b>${esc(r.n)}</b><div class="mu">${esc(r.c||'')} • ${(r.items||[]).length} صنف</div><div class="mu">🛵 توصيل من ${fmt(DB.cfg.min)}</div></div><span class="tag ${rOpen(r)?'on':'off'}">${rOpen(r)?'مفتوح':'مغلق'}</span></div>`}
function food(v){const R=Object.values(DB.rests);v.innerHTML=`<button class="l" onclick="go('home')">رجوع</button><h2>كل المطاعم</h2>`+(R.map(r=>rc(r,0)).join('')||'<p class="mu">لا توجد مطاعم بعد.</p>')}
function menu(v){const r=DB.rests[rid];if(!r)return go('food');const g={};(r.items||[]).forEach(i=>(g[i.cat||'القائمة']=g[i.cat||'القائمة']||[]).push(i));
v.innerHTML=`<button class="l" onclick="go('food')">رجوع</button><h2>${esc(r.n)}</h2>`+(rOpen(r)?'':'<div class="card off">المطعم مغلق حاليًا</div>')+Object.entries(g).map(([c,a])=>`<h3>${esc(c)}</h3>`+a.map(i=>{const ok=rOpen(r)&&itOk(i,r),n=cart[i.id]||0;return `<div class="card row" style="${ok?'':'opacity:.5'}">${pic(i)}<div class="g"><b>${esc(i.n)}</b><div class="mu">${esc(i.d||'')}</div><b>${fmt(i.p)}</b>${ok?'':'<div class="off">غير متاح الآن</div>'}</div>${ok?`<div class="row"><button class="q" onclick="ad('${i.id}',1)">+</button><b>${n}</b><button class="q l" onclick="ad('${i.id}',-1)">−</button></div>`:''}</div>`}).join(''))+(cnt()?`<div class="bar" onclick="go('co')"><span>السلة (${cnt()})</span><span>${fmt(sub())}</span></div>`:'')}
function upd(){const r=DB.rests[rid];if(!loc)return;const f=feeF(r,loc);$('#fee').textContent=fmt(f);$('#tot').textContent=fmt(sub()-dsc()+f)}
function co(v){const r=DB.rests[rid];loc=null;
v.innerHTML=`<button class="l" onclick="go('menu')">رجوع</button><h2>إتمام الطلب</h2><div class="card">${(r.items||[]).filter(i=>cart[i.id]).map(i=>`<div class="row sp"><span>${cart[i.id]} × ${esc(i.n)}</span><span>${fmt(cart[i.id]*i.p)}</span></div>`).join('')}<div class="row sp"><span>المجموع</span><b>${fmt(sub())}</b></div>${dsc()?`<div class="row sp on"><span>خصم ${esc(bestOf().t||'')}</span><b>- ${fmt(dsc())}</b></div>`:''}<div class="row sp"><span>التوصيل</span><b id="fee">حدد موقعك</b></div><div class="row sp"><b>الإجمالي</b><b id="tot">-</b></div></div><div class="card"><input id="cn" placeholder="الاسم" value="${esc(P.n||'')}"><input id="cp" type="tel" placeholder="رقم الهاتف" value="${esc(P.p||'')}"><textarea id="cm" rows="2" placeholder="وصف العنوان وأقرب نقطة دالة">${esc(P.a||'')}</textarea></div><b>موقع التوصيل</b> <button class="l" onclick="gps(p=>{ctl.put&&ctl.put('a',p);loc=p;upd()})">استخدم موقعي الحالي</button><div id="pm" class="map"></div><p class="mu">اضغط على الخريطة أو اسحب الدبوس لتحديد موقعك بدقة.</p><button class="big" onclick="order()">تأكيد الطلب</button>`;
ctl=mapPick($('#pm'),r.loc||BG,p=>{loc=p.a;upd()})}
async function order(){const r=DB.rests[rid],n=$('#cn').value.trim(),p=$('#cp').value.trim();if(!n||!p||!loc)return alert('أدخل الاسم والهاتف وحدد موقعك على الخريطة');
const its=(r.items||[]).filter(i=>cart[i.id]&&itOk(i,r)).map(i=>({n:i.n,q:cart[i.id],p:i.p}));if(!rOpen(r)||!its.length)return alert('المطعم مغلق أو الأصناف غير متاحة الآن');
P={n,p};localStorage.p=JSON.stringify(P);const fee=feeF(r,loc);
if(!await set('orders','o'+Date.now(),{cid:CID,rid:r.id,rn:r.n,rloc:r.loc||null,its,tot:its.reduce((s,i)=>s+i.q*i.p,0)-dsc()+fee,disc:dsc(),fee,cn:n,cp:p,loc,note:$('#cm').value,st:0,at:Date.now()}))return alert('تعذر إرسال الطلب');cart={};go('orders')}
/* ---- طلب التكسي (خريطة كاملة + شريط سفلي) ---- */
const CLS=[['s','سوبر','الخيار الأفضل','🚕',1],['e','توفير','التكسي الأوفر','💰',.85],['p','بلس','راحة أكثر','⭐',1.1]],r250=x=>Math.round(x/250)*250,
rfare=(km,m)=>{const c=DB.cfg;return Math.max(r250(c.min*m),r250((c.base+km*c.km)*m))},
TS=['بانتظار كابتن','الكابتن في الطريق إليك','وصل الكابتن','أنت في الرحلة','انتهت الرحلة'],
short=a=>String(a||'').split('،').slice(0,2).join('،').trim(),
rcent=()=>{try{return JSON.parse(localStorage.rcent||'[]')}catch(e){return[]}},
pushRecent=x=>{try{localStorage.rcent=JSON.stringify([x,...rcent().filter(r=>r.a!=x.a)].slice(0,6))}catch(e){}};
let tx={},tmap=null,tmk=[],tln=null,tqt=0,tgt=0;
function geoRev(p,cb){gm(()=>new google.maps.Geocoder().geocode({location:p},(r,s)=>{if(s!='OK'||!r||!r.length)return cb('');const x=r.find(i=>!(i.types||[]).includes('plus_code'))||r[0];cb(short(x.formatted_address))}))}
function taxi(v){document.querySelector('nav').hidden=1;tx={step:'pick',cls:'s',a:null,b:null,aa:'',ba:''};tmap=null;tmk=[];tln=null;
 const act=Object.values(DB.rides||{}).filter(r=>r.st>=0&&r.st<4).sort((a,b)=>b.at-a.at)[0];if(act){tx.rid=act.id;tx.step='wait'}
 v.innerHTML=`<div class="tx"><div class="mp"><div id="tmap"></div><div class="pin" id="tpin" hidden><b></b></div><button class="fb" id="tbk" style="inset-inline-start:14px" onclick="txBack()">✕</button><button class="fb" style="inset-inline-end:14px;bottom:14px" onclick="gps(p=>tmap&&tmap.panTo(p))">◎</button></div><div class="sh" id="tsh"></div></div>`;
 let c=BG;try{c=JSON.parse(localStorage.lastpos)||BG}catch(e){}
 gm(()=>{tmap=new google.maps.Map($('#tmap'),{center:c,zoom:16,disableDefaultUI:true,gestureHandling:'greedy',clickableIcons:false});tmap.addListener('idle',txIdle);
  navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{const q={lat:p.coords.latitude,lng:p.coords.longitude};try{localStorage.lastpos=JSON.stringify(q)}catch(e){}if(tx.step=='pick'&&!tx.moved)tmap.setCenter(q)},()=>{},{enableHighAccuracy:true,timeout:8000});
  tmap.addListener('dragstart',()=>{tx.moved=1});txStep()});txSheet()}
function txIdle(){if(!tmap||(tx.step!='pick'&&tx.step!='destmap'))return;const c=tmap.getCenter(),p={lat:c.lat(),lng:c.lng()},k=tx.step=='pick'?'a':'b';tx[k]=p;clearTimeout(tgt);tgt=setTimeout(()=>geoRev(p,a=>{if(tx[k]!==p)return;tx[k=='a'?'aa':'ba']=a;const e=$('#taddr');if(e)e.textContent=a||'عنوان غير معروف — يمكنك تأكيد الموقع'}),350)}
function txMarks(pts,line,fit){tmk.forEach(m=>m.setMap(null));tmk=[];if(tln){tln.setMap(null);tln=null}if(!tmap)return;const b=new google.maps.LatLngBounds();
 pts.forEach(x=>{const ic=x.k=='a'?{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:'#f26b1d',fillOpacity:1,strokeColor:'#fff',strokeWeight:4}:x.k=='b'?{path:'M -8,-8 8,-8 8,8 -8,8 z',fillColor:'#1f4fff',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}:{path:google.maps.SymbolPath.CIRCLE,scale:0};
  tmk.push(new google.maps.Marker({map:tmap,position:x.p,icon:ic,label:x.k=='d'?{text:'🚕',fontSize:'24px'}:null}));b.extend(x.p)});
 if(line&&pts.length>1)tln=new google.maps.Polyline({map:tmap,path:pts.map(x=>x.p),strokeColor:'#1f4fff',strokeOpacity:.9,strokeWeight:4,geodesic:true});
 if(fit){google.maps.event.trigger(tmap,'resize');if(pts.length>1)tmap.fitBounds(b,60);else if(pts.length==1){tmap.setCenter(pts[0].p);tmap.setZoom(16)}}}
function txStep(){const s=tx.step,pin=$('#tpin');if(!pin)return;pin.hidden=!(s=='pick'||s=='destmap');pin.className='pin'+(s=='destmap'?' d':'');$('#tbk').textContent=s=='pick'||s=='wait'?'✕':'→';
 txSheet();if(!tmap)return;setTimeout(()=>{google.maps.event.trigger(tmap,'resize');
  if(s=='pick'){txMarks([]);if(tx.a)tmap.setCenter(tx.a)}
  else if(s=='dest')txMarks([{p:tx.a,k:'a'}],0,1)
  else if(s=='destmap'){txMarks([]);tmap.setCenter(tx.b||tx.a);tx.moved=1}
  else if(s=='opts')txMarks([{p:tx.a,k:'a'},{p:tx.b,k:'b'}],1,1)
  else txWaitMap()},60)}
function txBack(){const s=tx.step;if(s=='pick'||s=='wait'){document.querySelector('nav').hidden=0;return go('home')}tx.step=s=='destmap'?'dest':s=='opts'?'dest':'pick';txStep()}
function txSheet(){const s=tx.step,h=$('#tsh');if(!h)return;
 if(s=='pick')h.innerHTML=`<div class="ad"><i class="dot o"></i><span id="taddr">${esc(tx.aa||'جارٍ تحديد العنوان…')}</span></div><div class="mu">حرّك الخريطة لتضع الدبوس على نقطة الانطلاق</div><button class="big" onclick="txPick()">تأكيد نقطة الانطلاق</button>`;
 else if(s=='dest')h.innerHTML=`<div class="ad"><i class="dot o"></i><span>${esc(tx.aa||'نقطة الانطلاق')}</span><button class="l sm" onclick="tx.step='pick';txStep()">تغيير</button></div><input id="tq" class="sq" style="margin:10px 0" placeholder="إلى أين؟" oninput="txSearch(this.value)" autocomplete="off"><div id="tres">${txRec()}</div><button class="l" style="width:100%" onclick="tx.step='destmap';txStep()">📍 اختر الوجهة على الخريطة</button>`;
 else if(s=='destmap')h.innerHTML=`<div class="ad"><i class="dot b"></i><span id="taddr">${esc(tx.ba||'جارٍ تحديد العنوان…')}</span></div><div class="mu">حرّك الخريطة لتضع الدبوس على الوجهة</div><button class="big" onclick="txDest()">تأكيد الوجهة</button>`;
 else if(s=='opts')txOpts(h);else txWait()}
const txRec=()=>rcent().map((r,i)=>`<div class="rs" onclick="txSetB(rcent()[${i}])">🕘 ${esc(r.a)}</div>`).join('');
function txPick(){if(!tx.a){const c=tmap.getCenter();tx.a={lat:c.lat(),lng:c.lng()}}try{localStorage.lastpos=JSON.stringify(tx.a)}catch(e){}tx.step='dest';txStep()}
function txDest(){if(!tx.b){const c=tmap.getCenter();tx.b={lat:c.lat(),lng:c.lng()}}tx.ba=tx.ba||'نقطة على الخريطة';tx.step='opts';txStep()}
function txSetB(x){if(!x)return;tx.b={lat:x.lat,lng:x.lng};tx.ba=x.a;tx.step='opts';txStep()}
function txSearch(q){clearTimeout(tqt);q=q.trim();if(q.length<2){$('#tres').innerHTML=txRec();return}tqt=setTimeout(()=>gm(()=>{const c=tmap.getCenter(),d=.35,bd=new google.maps.LatLngBounds({lat:c.lat()-d,lng:c.lng()-d},{lat:c.lat()+d,lng:c.lng()+d});
 new google.maps.Geocoder().geocode({address:q,bounds:bd,region:'IQ'},(r,s)=>{const e=$('#tres');if(!e||$('#tq').value.trim()!=q)return;if(s=='OK'&&r.length){tx.res=r.slice(0,6).map(x=>({a:short(x.formatted_address),lat:x.geometry.location.lat(),lng:x.geometry.location.lng()}));e.innerHTML=tx.res.map((x,i)=>`<div class="rs" onclick="txSetB(tx.res[${i}])">📍 ${esc(x.a)}</div>`).join('')}else e.innerHTML='<p class="mu">'+(s=='ZERO_RESULTS'?'لا توجد نتائج. جرّب اسمًا آخر أو اختر من الخريطة.':'تعذر البحث بالاسم الآن، اختر الوجهة من الخريطة.')+'</p>'})}),400)}
function txOpts(h){const km=+(dist(tx.a,tx.b)*1.3).toFixed(1);
 if(km<.05||km>100){h.innerHTML=`<div class="card off">للأسف، لا يمكن حساب تكلفة هذه الرحلة.</div><button class="big" onclick="tx.step='dest';txStep()">حسنًا</button>`;return}
 const need=!P.n||!P.p,c=CLS.find(x=>x[0]==tx.cls);
 h.innerHTML=`<div class="ad"><i class="dot o"></i><span>${esc(short(tx.aa))}</span></div><div class="ad" onclick="tx.step='dest';txStep()"><i class="dot b"></i><span>${esc(short(tx.ba))}</span><b class="mu">${km} كم</b></div>`+CLS.map(x=>`<div class="cl ${tx.cls==x[0]?'a':''}" onclick="txCls('${x[0]}')"><span class="ci">${x[3]}</span><div class="g"><b>${x[1]}</b><div class="mu">${x[2]}</div></div><b>${fmt(rfare(km,x[4]))}</b></div>`).join('')+(need?`<input id="cn" placeholder="الاسم" value="${esc(tx.n||P.n||'')}"><input id="cp" type="tel" placeholder="رقم الهاتف" value="${esc(tx.p||P.p||'')}">`:'')+`<button class="big" onclick="txGo()">اطلب ${c[1]}</button>`}
function txCls(k){const a=$('#cn'),b=$('#cp');if(a)tx.n=a.value;if(b)tx.p=b.value;tx.cls=k;txSheet()}
