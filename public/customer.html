<script>

const sub=()=>(DB.rests[rid].items||[]).reduce((s,i)=>s+(cart[i.id]||0)*i.p,0);
const bestOf=()=>Object.values(DB.offers||{}).filter(o=>o.on!==0&&o.pct&&(!o.rid||o.rid==rid)).sort((a,b)=>b.pct-a.pct)[0],dsc=()=>{const o=bestOf();return o?Math.round(sub()*o.pct/100):0};

hd=(t,b)=>`<div class="bh"><button class="ci" onclick="go('home')" aria-label="الرئيسية">🏠</button><h1>${t}</h1><button class="ci" onclick="${b||"go('home')"}" aria-label="رجوع">›</button></div>`,
payOpts=(cur,js,amt,only)=>PM.filter(x=>only.includes(x[0])).map(x=>`<div class="po ${cur==x[0]?'a':''}" onclick="${js.replace('$',x[0])}"><i class="rd"></i><div class="g"><b>${x[1]}</b><div class="mu">${x[0]=='wallet'?'رصيدك '+fmt(bal())+(bal()<amt?' — غير كافٍ':''):x[0]=='master'?'ادفع ببطاقتك الائتمانية أو المصرفية':x[0]=='zain'?'ادفع باستخدام زين كاش':'ادفع للكابتن عند الاستلام'}</div></div><span class="po-i">${x[2]}</span></div>`).join('');

const rg=(r,pc)=>{const fee=r.fd?0:DB.cfg.min,rt=+r.rt>0,bg=r.cv||r.img;return `<div class="rcg" data-s="${esc(r.n+' '+(r.c||'')+' '+(r.items||[]).map(i=>i.n).join(' '))}" onclick="rid='${r.id}';cart={};go('menu')"><div class="rim">${bg?`<img alt="" src="${esc(bg)}">`:ico(r)}${pc?`<i class="pcb">${pc}%</i>`:''}${r.fd?'<i class="rfd">توصيل مجاني</i>':''}${r.cv&&r.img?`<span class="rlg"><img alt="" src="${esc(r.img)}"></span>`:''}${rt?`<span class="rrt"><b>${(+r.rt).toFixed(1)}</b> ★${r.rn?` <small>(${esc(r.rn)})</small>`:''}</span>`:''}${rOpen(r)?'':'<i class="cl">مغلق</i>'}</div><b>${esc(r.n)}</b><div class="mu">${esc(r.c||'')}</div><div class="mt"><span>🛵 ${fee?fmt(fee):'مجاني'}</span><span>🕒 ${(r.prep||15)+10}-${(r.prep||15)+25} د</span></div></div>`};

<div class="loc2" onclick="go('acct')">📍 التوصيل إلى: ${esc((P.a||'حدد موقعك').slice(0,28))} ▾</div>
${O.length?`<div class="bn">${O.slice(0,6).map((o,i)=>`<div class="b${i%2?1:0}" style="${o.img?`background:#000 url('${esc(o.img)}') center/cover`:''}" onclick="${o.rid&&DB.rests[o.rid]?`rid='${o.rid}';cart={};go('menu')`:`go('offers')`}"><small>${esc(o.t)}</small>${o.pct?`<strong>${o.pct}%</strong>`:'<strong>🎁</strong>'}<b>${esc(o.d||'اطلب الآن ›')}</b></div>`).join('')}</div>`:''}

<div class="chips">${[['all','الكل','☰'],['free','توصيل مجاني','🛵'],['off','خصم','🏷️'],['top','الأعلى تقييمًا','⭐'],['open','مفتوح الآن','🟢']].map(c=>`<button class="${fq==c[0]?'a':''}" onclick="fq='${c[0]}';draw()"><span>${c[2]}</span>${c[1]}</button>`).join('')}</div>
${D.length&&fq=='all'?`<div class="dk"><div class="row sp"><h2>خصومات %${top}</h2><button onclick="go('offers')">المزيد ›</button></div><div class="rg">${D.map(r=>rg(r,pc(r))).join('')}</div></div>`:''}

function cards(v){const C=Object.values(DB.cards||{}),M=Object.values(DB.cardorders||{}).sort((a,b)=>b.at-a.at),g={};C.forEach(c=>(g[c.cat||'بطاقات']=g[c.cat||'بطاقات']||[]).push(c));
v.innerHTML=hd('البطاقات')+(Object.entries(g).map(([k,a])=>`<h2>${esc(k)}</h2><div class="cgrid">${a.map(c=>`<div class="ctl" onclick="cbk='${c.id}';pm='${bal()>=c.p?'wallet':'master'}';go('cbuy')"><div class="cbx">${esc(c.e||'💳')}</div>${esc(c.n)}<div class="mu">${fmt(c.p)}</div></div>`).join('')}</div>`).join('')||'<p class="mu">لا توجد بطاقات متاحة.</p>')+(M.length?'<h2>طلباتي من البطاقات</h2>':'')+M.map(m=>`<div class="card"><div class="row sp"><b>${esc(m.cn2)}</b><span class="tag ${stc(m.st)}">${m.st>0?'تم التسليم':m.st<0?'مرفوض':'قيد المعالجة'}</span></div><div class="mu">${pmN(m.pay)}${m.paid?' • تم الدفع من المحفظة':''}${m.refd?' • أُعيد المبلغ للمحفظة':''}</div>${m.code?`<div class="code">${esc(m.code)}</div>`:''}</div>`).join('')}
function cbuy(v){const c=DB.cards[cbk];if(!c)return go('cards');
v.innerHTML=hd('شراء المنتج',"go('cards')")+`<div class="card row"><div class="em">${esc(c.e||'💳')}</div><div class="g"><b>${esc(c.n)}</b><div class="mu">${esc(c.d||'')}</div></div><b>${fmt(c.p)}</b></div><h3 style="color:var(--tx)">طريقة الدفع</h3>${payOpts(pm,"pm='$';draw()",c.p,['wallet','master','zain'])}<div class="card"><div class="row sp"><span>السعر</span><b>${fmt(c.p)}</b></div><div class="row sp"><span>طريقة الدفع</span><b>${pmN(pm)}</b></div><div class="row sp"><b>المجموع الكلي</b><b>${fmt(c.p)}</b></div></div><button class="big" onclick="buyC('${c.id}')">تأكيد الشراء</button>${pm=='wallet'?'':'<p class="mu">سيتواصل معك فريق الدعم لإتمام الدفع وتسليم الكود.</p>'}`}
async function buyC(id){const c=DB.cards[id];if(!P.p||!P.n){alert('أكمل اسمك ورقمك من الحساب أولاً');return go('prof')}if(pm=='wallet'&&bal()<c.p)return alert('رصيد المحفظة غير كافٍ — اشحن محفظتك أولاً');
if(!await set('cardorders','b'+Date.now(),{cid:CID,cn:P.n,cp:P.p,card:id,cn2:c.n,p:c.p,pay:pm,st:0,at:Date.now()}))return alert('تعذر إتمام الشراء');alert(pm=='wallet'?'تم الدفع من محفظتك، سيصلك الكود قريبًا':'استلمنا طلبك، سيتواصل معك الدعم لإتمام الدفع');go('cards')}
function wallet(v){const X=Object.values(DB.ctx||{}).sort((a,b)=>b.at-a.at).slice(0,15),T=Object.values(DB.ctop||{}).sort((a,b)=>b.at-a.at).slice(0,5);
v.innerHTML=hd('المحفظة',"go('acct')")+`<div class="wl"><span>رصيدك</span><b>${fmt(bal())}</b><button onclick="go('addf')">+ إضافة أموال</button></div>`+(T.length?'<h3>طلبات الشحن</h3>'+T.map(t=>`<div class="card row sp"><div><b>${fmt(t.amt)}</b><div class="mu">${pmN(t.m)} • ${hrs(t.at)}</div>${t.st<0&&t.why?`<div class="mu off">${esc(t.why)}</div>`:''}</div><span class="tag ${stc(t.st)}">${t.st>0?'تم الشحن':t.st<0?'مرفوض':'قيد المراجعة'}</span></div>`).join(''):'')+(X.length?'<h3>آخر الحركات</h3><div class="card">'+X.map(x=>`<div class="row sp"><span>${esc(x.why)}</span><b class="${x.amt<0?'off':'on'}">${x.amt>0?'+':''}${fmt(x.amt)}</b></div>`).join('')+'</div>':'<p class="mu">لا توجد حركات بعد.</p>')}
const afs=d=>{af.a=Math.max(1000,Math.min(5e6,(af.a||0)+d*(af.a>=20000?5000:1000)));draw()};
function addf(v){v.innerHTML=hd('إضافة أموال',"go('wallet')")+`<div class="chips2">${[5000,10000,20000,50000].map(x=>`<button class="${af.a==x?'a':''}" onclick="af.a=${x};draw()">${x.toLocaleString('en-US')} دينار</button>`).join('')}</div><div class="stp"><button onclick="afs(1)" aria-label="زيادة">+</button><b>${fm(af.a)}</b><button onclick="afs(-1)" aria-label="إنقاص">−</button></div><h3 style="color:var(--tx)">طريقة الدفع</h3>${payOpts(af.m,"af.m='$';draw()",0,['master','zain'])}<button class="big" onclick="go('payi')">تعبئة</button>`}
function payi(v){const p=(DB.cfg.pay||[]).find(x=>af.m=='zain'?/زين/.test(x.n):/ماستر|فيزا|بطاقة|كارد/.test(x.n));
v.innerHTML=hd('تحويل المبلغ',"go('addf')")+`<div class="wl"><span>حوّل هذا المبلغ عبر ${pmN(af.m)}</span><b>${fmt(af.a)}</b></div><div class="card"><b>بيانات التحويل</b><div class="mu" style="white-space:pre-line;user-select:all;margin-top:6px">${p?esc(p.d):'تواصل مع الدعم للحصول على بيانات التحويل.'}</div></div><label class="card up"><span><b>صورة وصل التحويل</b><div class="mu ${af.img?'on':''}">${af.img?'تم الرفع ✓':'اضغط للاختيار'}</div></span><span>📷</span><input type="file" hidden accept="image/*" onchange="afUp(this)"></label><input id="afr" placeholder="رقم العملية (اختياري)" value="${esc(af.ref)}" oninput="af.ref=this.value"><button class="big" onclick="afSend()">تأكيد الدفع</button><p class="mu">تُضاف الأموال إلى محفظتك بعد مراجعة الإدارة للوصل.</p>`}
async function afUp(el){const f=el.files[0];if(!f)return;try{af.img=await upl(f,1400)}catch(e){alert(e==401?'انتهت الجلسة، أعد تسجيل الدخول':'فشل رفع الصورة')}draw()}
async function afSend(){if(!af.img)return alert('أرفق صورة وصل التحويل');if(!await set('ctop','p'+Date.now().toString(36),{cid:CID,amt:af.a,m:af.m,img:af.img,ref:af.ref}))return alert('تعذر إرسال الطلب');af={a:10000,m:'master',img:'',ref:''};alert('تم إرسال طلب الشحن للمراجعة');go('wallet')}
function prof(v){v.innerHTML=hd('الحساب',"go('acct')")+`<div class="card"><input id="pn" placeholder="الاسم" value="${esc(P.n||'')}"><input id="pp" type="tel" placeholder="رقم الهاتف" value="${esc(P.p||'')}"><textarea id="pa" rows="2" placeholder="العنوان الافتراضي">${esc(P.a||'')}</textarea><button class="big" onclick="P={n:$('#pn').value.trim(),p:$('#pp').value.trim(),a:$('#pa').value.trim()};localStorage.p=JSON.stringify(P);alert('تم الحفظ')">حفظ</button></div>`}
function acct(v){const a=myApp(),R=(i,t,s,f,x)=>`<div class="lr" onclick="${f}"><span class="li">${i}</span><div class="g"><div>${t}</div>${s?`<div class="mu">${s}</div>`:''}</div>${x||''}<span class="ch">‹</span></div>`;
v.innerHTML=`<div class="bh"><button class="ci" onclick="go('home')" aria-label="الرئيسية">🏠</button><h1>الحساب</h1><span class="ci" style="visibility:hidden"></span></div><div id="vc"></div>`+R('👤','الحساب',esc(P.n||''),"go('prof')",`<b class="ph" dir="ltr">${esc(P.p||'—')}</b>`)+R('👛','المحفظة','',"go('wallet')",`<b class="ph">${fmt(bal())}</b>`)+R('🧾','طلباتي ورحلاتي','',"go('orders')")+R('🛡️','الأجهزة وجلسات الدخول','',"go('devs')")+R('🏷️','القسائم والخصومات','',"go('offers')")+R('💳','البطاقات','',"go('cards')")+R('🧑‍✈️',a?'حالة طلب الكابتن':'التسجيل ككابتن','',"go('join')",a?`<span class="tag ${stc(a.st)}">${a.st>0?'مفعّل':a.st<0?'مرفوض':'قيد المراجعة'}</span>`:'')+R('🎧','مركز المساعدة','',"help('')")+R('🎨','مظهر التطبيق','',"document.querySelector('.tb button').click()")+R('🚪','خروج','',"out()");vcard()}
const DOC=[['idf','الهوية — الوجه الأمامي','image/*'],['idb','الهوية — الوجه الخلفي','image/*'],['lic','إجازة السوق','image/*'],['car1','السيارة من الأمام','image/*'],['car2','السيارة من الخلف','image/*'],['car3','داخل السيارة','image/*'],['v1','فيديو تعريفي: صوّر نفسك وأنت تمسك هويتك وتقول اسمك','video/*'],['v2','فيديو للسيارة من الخارج والداخل','video/*']];let dc={};
function join(v){const a=myApp();if(a&&a.st>=0){v.innerHTML=`<button class="l" onclick="go('acct')">رجوع</button><h1>طلب الكابتن</h1><div class="card"><div class="row sp"><b>${esc(a.n)}</b><span class="tag ${stc(a.st)}">${a.st>0?'مفعّل':'قيد المراجعة'}</span></div><div class="mu">${a.st>0?'تم تفعيل حسابك. حمّل تطبيق الكابتن وسجّل الدخول بهذه البيانات:':'استلمنا مستنداتك وسنراجعها قريبًا. سيظهر هنا قرار التفعيل.'}</div>${a.st>0?`<div class="code">رمز الدخول: ${esc(a.did)}<br>الرمز السري: ${esc(a.pin)}</div>`:''}</div>`;return}
dc={};v.innerHTML=`<button class="l" onclick="go('acct')">رجوع</button><h1>سجّل ككابتن</h1>${a&&a.st<0?`<div class="card off">رُفض طلبك السابق: ${esc(a.why||'')}. يمكنك التقديم من جديد.</div>`:''}<div class="card"><select id="jt"><option value="delivery">كابتن توصيل طعام</option><option value="taxi">كابتن تكسي</option><option value="both">توصيل وتكسي</option></select><input id="jn" placeholder="الاسم الثلاثي" value="${esc(P.n||'')}"><input id="jp" type="tel" placeholder="رقم الهاتف" value="${esc(P.p||'')}"><input id="jc" placeholder="المدينة"><input id="jm" placeholder="نوع السيارة وموديلها"><input id="jl" placeholder="رقم اللوحة"></div>${DOC.map(d=>`<label class="card up"><span><b>${d[1]}</b><div class="mu" id="s_${d[0]}">اضغط للاختيار</div></span><span>${d[2][0]=='v'?'🎥':'📷'}</span><input type="file" hidden accept="${d[2]}" onchange="upF('${d[0]}',this)"></label>`).join('')}<button class="big" onclick="sendJ()">إرسال الطلب</button>`}
async function upF(k,el){const f=el.files[0];if(!f)return;const s=$('#s_'+k);if(f.size>5e7){s.textContent='الملف كبير (الحد 50MB)';return}s.textContent='جارٍ الرفع…';try{dc[k]=await upl(f,1400);s.textContent='تم الرفع ✓';s.className='mu on'}catch(e){s.textContent=e==401?'انتهت الجلسة، أعد تسجيل الدخول':e==413?'الملف كبير جدًا':'فشل الرفع، أعد المحاولة';s.className='mu off'}}
async function sendJ(){const g=i=>$('#'+i).value.trim();if(!g('jn')||!g('jp')||!g('jm')||!g('jl'))return alert('أكمل البيانات');const m=DOC.find(d=>!dc[d[0]]);if(m)return alert('ارفع: '+m[1]);if(!await set('apps','a'+Date.now(),{cid:CID,type:$('#jt').value,n:g('jn'),ph:g('jp'),city:g('jc'),car:g('jm'),plate:g('jl'),docs:dc,st:0,at:Date.now()}))return alert('تعذر الإرسال');go('join')}
AUTH.token?start(ch=>{if(first&&myRide()&&view=='home')view='taxi';if(first||(ch&&(['orders','cards','home','offers','taxi','trips','food','wallet','cbuy'].includes(view)||view=='acct'||(view=='join'&&myApp()&&myApp().st>=0))&&!busy())){first=0;draw()}}):draw();
</script></body></html>
