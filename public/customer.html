<!DOCTYPE html>
<html lang="ar" dir="rtl" data-app="customer"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تكسي المتميز - طعام وتكسي</title>
<link rel="stylesheet" href="shared.css"><script src="config.js"></script><script src="shared.js"></script><style>
[data-app=customer]{--pr:#1f4fff;--pt:#fff}@media(prefers-color-scheme:dark){[data-app=customer]{--pr:#7d97ff;--pt:#050a24}}
[data-app=customer] .tb{display:none}
.fh{display:flex;gap:10px;align-items:center;margin:2px 0 14px}.pill{background:var(--cd);border:1px solid var(--bd);border-radius:999px;min-height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:700;box-shadow:var(--sh);color:var(--tx);cursor:pointer;white-space:nowrap}.pill.c{width:48px;padding:0;justify-content:center;font-size:20px;flex:none}.pill.g{flex:1;min-width:0;overflow:hidden}.brand{font-weight:800;font-size:22px;color:var(--pr);font-style:italic}
.sq{margin:0 0 12px;border-radius:999px}
.bn{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}.bn>div{flex:none;width:62%;max-width:290px;height:210px;border-radius:24px;padding:18px;color:#fff;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden}.bn small{font-weight:700;opacity:.9}.bn strong{font-size:60px;line-height:1;font-weight:800}.bn b{font-size:18px}.b0{background:#0b1220}.b1{background:#1f4fff}.b2{background:#f6ede1;color:#0f1f21!important}.b3{background:#e8412c}
.cats{background:var(--cd);border:1px solid var(--bd);border-radius:26px;padding:16px;margin:12px 0}.cats h2{margin:0 0 12px}.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:13px;font-weight:600}.cg div{cursor:pointer}.cg span{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 4px;border-radius:50%;background:var(--bg);font-size:30px;box-shadow:var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;scrollbar-width:none}.chips button{background:var(--cd);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}.chips button.a{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.dk{background:#0b1220;border-radius:28px;padding:14px;margin:12px 0;color:#fff}.dk .row{margin-bottom:10px}.dk h2{margin:0;color:#fff}.dk button{background:transparent;border:1.5px solid #fff;color:#fff}
.rr{display:flex;gap:12px;align-items:center;background:var(--cd);color:var(--tx);border-radius:22px;padding:10px;margin:10px 0;cursor:pointer;border:1px solid var(--bd)}.rr:active{transform:scale(.985)}.lg2{position:relative;flex:none}.lg2 .em{width:84px;height:84px;border-radius:18px}.bd{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--pr);color:var(--pt);font-weight:800;font-size:13px;padding:2px 9px;border-radius:99px;border:2px solid var(--cd)}
[data-app=customer] nav{inset-inline:0;bottom:0;max-width:none;border-radius:0;border-width:1px 0 0;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));background:var(--cd);box-shadow:0 -4px 18px rgba(0,0,0,.06)}
[data-app=customer] nav button{position:relative;flex-direction:column;gap:2px;font-size:12px;min-height:50px;border-radius:12px;background:none;color:var(--tx);font-weight:600;padding:4px}nav button i{font-style:normal;font-size:22px;line-height:1.2}nav button.a{background:none;color:var(--pr)}nav u{position:absolute;top:0;inset-inline-end:22%;text-decoration:none;background:#e8412c;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:800}
.lgn{text-align:center;padding-top:8vh}.lgn .brand{font-size:44px}.or{color:var(--mu);margin:14px 0}#gb{display:flex;justify-content:center;min-height:44px}
</style></head>
<body><div id="app"><div id="v"></div><div id="tm" class="map" hidden></div></div>
<nav><button data-t="home" onclick="go('home')"><i>🏠</i>الرئيسية</button><button data-t="orders" onclick="go('orders')"><i>📦</i>الطلبات</button><button data-t="cart" onclick="go('cart')"><i>🛒</i><u id="cb" hidden>0</u>السلة</button><button data-t="offers" onclick="go('offers')"><i>🏷️</i>القسائم</button><button data-t="acct" onclick="go('acct')"><i>👤</i>الحساب</button></nav>
<script>
const CID=localStorage.cid||'';
AUTH={role:'customer',id:CID,token:localStorage.tok||''};
let P=JSON.parse(localStorage.p||'{}'),view='home',rid=null,cart={},loc=null,ctl=null,rp={},first=1;
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const sub=()=>(DB.rests[rid].items||[]).reduce((s,i)=>s+(cart[i.id]||0)*i.p,0);
const bestOf=()=>Object.values(DB.offers||{}).filter(o=>o.on!==0&&o.pct&&(!o.rid||o.rid==rid)).sort((a,b)=>b.pct-a.pct)[0],dsc=()=>{const o=bestOf();return o?Math.round(sub()*o.pct/100):0};
const feeF=(r,l)=>{const c=DB.cfg;return Math.max(c.min,Math.round((c.base+(r.loc&&l?dist(r.loc,l)*1.3*c.foodKm:0))/250)*250)};
const go=v=>{view=v;draw();scrollTo(0,0)};
const ad=(id,d)=>{cart[id]=Math.max(0,(cart[id]||0)+d);draw()};
function draw(){if(!AUTH.token)return login($('#v'));$('#tm').hidden=1;const M={food:'home',menu:'home',co:'cart',taxi:'home',join:'acct',cards:'acct'};document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('a',b.dataset.t==(M[view]||view)));const cb=$('#cb');cb.textContent=cnt();cb.hidden=!cnt();({home,food,menu,co,cart:cartv,taxi,orders,offers,cards,acct,join})[view]($('#v'))}
function rc(r,pc){return `<div class="rr rc" data-s="${esc(r.n+' '+(r.c||'')+' '+(r.items||[]).map(i=>i.n).join(' '))}" onclick="rid='${r.id}';cart={};go('menu')"><div class="lg2">${pic(r)}${pc?`<span class="bd">${pc}%</span>`:''}</div><div class="g"><b>${esc(r.n)}</b><div class="mu">${esc(r.c||'')} • ${(r.items||[]).length} صنف</div><div class="mu">🛵 توصيل من ${fmt(DB.cfg.min)}</div></div><span class="tag ${rOpen(r)?'on':'off'}">${rOpen(r)?'مفتوح':'مغلق'}</span></div>`}
function food(v){const R=Object.values(DB.rests);v.innerHTML=`<button class="l" onclick="go('home')">رجوع</button><h2>كل المطاعم</h2>`+(R.map(r=>rc(r,0)).join('')||'<p class="mu">لا توجد مطاعم بعد.</p>')}
function menu(v){const r=DB.rests[rid];if(!r)return go('food');const g={};(r.items||[]).forEach(i=>(g[i.cat||'القائمة']=g[i.cat||'القائمة']||[]).push(i));
v.innerHTML=`<button class="l" onclick="go('food')">رجوع</button><h2>${esc(r.n)}</h2>`+(rOpen(r)?'':'<div class="card off">المطعم مغلق حاليًا</div>')+Object.entries(g).map(([c,a])=>`<h3>${esc(c)}</h3>`+a.map(i=>{const ok=rOpen(r)&&itOk(i,r),n=cart[i.id]||0;return `<div class="card row" style="${ok?'':'opacity:.5'}">${pic(i)}<div class="g"><b>${esc(i.n)}</b><div class="mu">${esc(i.d||'')}</div><b>${fmt(i.p)}</b>${ok?'':'<div class="off">غير متاح الآن</div>'}</div>${ok?`<div class="row"><button class="q" onclick="ad('${i.id}',1)">+</button><b>${n}</b><button class="q l" onclick="ad('${i.id}',-1)">−</button></div>`:''}</div>`}).join(''))+(cnt()?`<div class="bar" onclick="go('co')"><span>السلة (${cnt()})</span><span>${fmt(sub())}</span></div>`:'')}
function upd(){const r=DB.rests[rid];if(!loc)return;const f=feeF(r,loc);$('#fee').textContent=fmt(f);$('#tot').textContent=fmt(sub()-dsc()+f)}
function co(v){const r=DB.rests[rid];loc=null;
v.innerHTML=`<button class="l" onclick="go('menu')">رجوع</button><h2>إتمام الطلب</h2><div class="card">${(r.items||[]).filter(i=>cart[i.id]).map(i=>`<div class="row sp"><span>${cart[i.id]} × ${esc(i.n)}</span><span>${fmt(cart[i.id]*i.p)}</span></div>`).join('')}<div class="row sp"><span>المجموع</span><b>${fmt(sub())}</b></div>${dsc()?`<div class="row sp on"><span>خصم ${esc(bestOf().t||'')}</span><b>- ${fmt(dsc())}</b></div>`:''}<div class="row sp"><span>التوصيل</span><b id="fee">حدد موقعك</b></div><div class="row sp"><b>الإجمالي</b><b id="tot">-</b></div></div><div class="card"><input id="cn" placeholder="الاسم" value="${esc(P.n||'')}"><input id="cp" type="tel" placeholder="رقم الهاتف" value="${esc(P.p||'')}"><textarea id="cm" rows="2" placeholder="وصف العنوان وأقرب نقطة دالة">${esc(P.a||'')}</textarea></div><b>موقع التوصيل</b> <button class="l" onclick="gps(p=>{ctl.put&&ctl.put('a',p);loc=p;upd()})">استخدم موقعي الحالي</button><div id="pm" class="map"></div><p class="mu">اضغط على الخريطة أو اسحب الدبوس لتحديد موقعك بدقة.</p><button class="big" onclick="order()">تأكيد الطلب</button>`;
ctl=mapPick($('#pm'),r.loc||BG,p=>{loc=p.a;upd()})}
async function order(){const r=DB.rests[rid],n=$('#cn').value.trim(),p=$('#cp').value.trim();if(!n||!p||!loc)return alert('أدخل الاسم والهاتف وحدد موقعك على الخريطة');
const its=(r.items||[]).filter(i=>cart[i.id]&&itOk(i,r)).map(i=>({n:i.n,q:cart[i.id],p:i.p}));if(!rOpen(r)||!its.length)return alert('المطعم مغلق أو الأصناف غير متاحة الآن');
P={n,p};localStorage.p=JSON.stringify(P);const fee=feeF(r,loc);
if(!await set('orders','o'+Date.now(),{cid:CID,rid:r.id,rn:r.n,rloc:r.loc||null,its,tot:its.reduce((s,i)=>s+i.q*i.p,0)-dsc()+fee,disc:dsc(),fee,cn:n,cp:p,loc,note:$('#cm').value,st:0,at:Date.now()}))return alert('تعذر إرسال الطلب');cart={};go('orders')}
const fare=()=>{if(!rp.a||!rp.b)return 0;const c=DB.cfg;return Math.max(c.min,Math.round((c.base+dist(rp.a,rp.b)*1.3*c.km)/250)*250)};
function est(){$('#est').innerHTML=rp.a&&rp.b?`المسافة التقريبية ${(dist(rp.a,rp.b)*1.3).toFixed(1)} كم • الأجرة التقديرية <b>${fmt(fare())}</b>`:'حدد نقطتي الانطلاق والوجهة على الخريطة'}
function taxi(v){rp={};v.innerHTML=`<button class="l" onclick="go('home')">رجوع</button><h2>اطلب تكسي</h2><div class="bt"><button onclick="ctl.cur='a'">الانطلاق (أ)</button><button class="l" onclick="ctl.cur='b'">الوجهة (ب)</button><button class="l" onclick="gps(p=>{ctl.put&&ctl.put('a',p);rp.a=p;ctl.cur='b';est()})">موقعي</button></div><div id="pm" class="map"></div><div class="card" id="est"></div><div class="card"><input id="cn" placeholder="الاسم" value="${esc(P.n||'')}"><input id="cp" type="tel" placeholder="رقم الهاتف" value="${esc(P.p||'')}"></div><button class="big" onclick="ride()">اطلب كابتن</button>`;est();
ctl=mapPick($('#pm'),BG,p=>{rp={a:p.a,b:p.b};if(rp.a&&!rp.b)ctl.cur='b';est()})}
async function ride(){const n=$('#cn').value.trim(),p=$('#cp').value.trim();if(!n||!p||!rp.a||!rp.b)return alert('أدخل الاسم والهاتف وحدد الانطلاق والوجهة');P={n,p};localStorage.p=JSON.stringify(P);
if(!await set('rides','t'+Date.now(),{cid:CID,cn:n,cp:p,from:rp.a,to:rp.b,km:+(dist(rp.a,rp.b)*1.3).toFixed(1),fare:fare(),st:0,at:Date.now()}))return alert('تعذر إرسال الطلب');go('orders')}
async function cx(k,id){if(confirm('إلغاء الطلب؟')){await set(k,id,{cid:CID,st:-1});draw()}}
async function help(id){const m=prompt('اكتب مشكلتك وسيرد عليك فريق الدعم');if(m){await set('tickets','k'+Date.now(),{cid:CID,cn:P.n||'',cp:P.p||'',oid:id,msg:m,st:0,at:Date.now()});draw()}}
function orders(v){const js=[...Object.values(DB.orders).map(o=>({...o,k:'orders',S:FS,t:'🍽️ '+o.rn})),...Object.values(DB.rides).map(o=>({...o,k:'rides',S:RS,t:'🚕 رحلة تكسي'}))].sort((a,b)=>b.at-a.at);
v.innerHTML='<button class="l" onclick="go(\'acct\')">رجوع</button><h2>طلباتي</h2>'+(js.map(o=>{const d=DB.drivers[o.did];return `<div class="card"><div class="row sp"><b>${o.t}</b><span class="tag">${o.st<0?'ملغي':o.S[o.st]}</span></div>${o.st<0?'':steps(o.S,o.st)}<div class="mu">${o.its?o.its.map(i=>i.q+' × '+esc(i.n)).join('، '):'من أ إلى ب • '+o.km+' كم'}</div>${d?`<div class="row sp"><span>الكابتن: ${esc(d.n)} ${esc(d.car||'')}</span><a href="tel:${esc(d.ph)}">اتصال</a></div>`:''}<div class="row sp"><b>${fmt(o.tot||o.fare)}</b><div class="bt">${o.st==0?`<button class="d" onclick="cx('${o.k}','${o.id}')">إلغاء</button>`:''}<button class="l" onclick="help('${o.id}')">مساعدة</button></div></div></div>`}).join('')||'<p class="mu">لا توجد طلبات بعد.</p>')
+Object.values(DB.tickets).map(t=>`<div class="card"><div class="mu">رسالتك</div>${esc(t.msg)}${t.rep?`<div class="mu" style="margin-top:6px">رد الدعم</div><b>${esc(t.rep)}</b>`:'<div class="mu">بانتظار الرد</div>'}</div>`).join('');
const j=js.find(o=>DB.drivers[o.did]&&DB.drivers[o.did].loc&&o.st>=1&&o.st<4&&(o.k=='rides'||o.st>=2));
if(j){const d=DB.drivers[j.did],t=j.k=='orders'?j.loc:j.st<3?j.from:j.to;$('#tm').hidden=0;showMap($('#tm'),[{p:d.loc,l:'ك',t:'الكابتن'},{p:t,l:'أ',t:'الوجهة'}])}}
const myApp=()=>Object.values(DB.apps||{}).sort((a,b)=>b.at-a.at)[0],stc=s=>s>0?'s':s<0?'x':'w';
let fq='all';
function home(v){const O=Object.values(DB.offers||{}).filter(x=>x.on!==0),R=Object.values(DB.rests),pc=r=>Math.max(0,...O.filter(o=>o.pct&&(!o.rid||o.rid==r.id)).map(o=>+o.pct)),top=Math.max(0,...O.map(o=>+o.pct||0)),
cats=[...new Set(R.flatMap(r=>(r.c||'').split(/[•,،]/).map(x=>x.trim()).filter(Boolean)))].slice(0,8),
L=R.filter(r=>fq=='off'?pc(r)>0:fq=='open'?rOpen(r):1),D=R.filter(r=>pc(r)>0);
v.innerHTML=`<div class="fh"><div class="pill c" onclick="go('home')">🏠</div><div class="pill c" onclick="const q=$('#sq');q.hidden=!q.hidden;q.focus()">🔍</div><div class="pill g" onclick="go('acct')">📍 ${esc((P.a||'حدد الموقع').slice(0,22))}</div><div class="pill brand">تكسي المتميز</div></div><input id="sq" class="sq" hidden placeholder="ابحث عن مطعم أو أكلة…" oninput="document.querySelectorAll('.rc').forEach(c=>c.hidden=!c.dataset.s.includes(this.value.trim()))">
<div class="bn">${O.slice(0,4).map((o,i)=>`<div class="b${i%2?1:0}" onclick="${o.rid&&DB.rests[o.rid]?`rid='${o.rid}';cart={};go('menu')`:`go('offers')`}"><small>${esc(o.t)}</small>${o.pct?`<strong>${o.pct}%</strong>`:'<strong>🎁</strong>'}<b>${esc(o.d||'اطلب الآن ›')}</b></div>`).join('')}<div class="b2" onclick="go('taxi')"><small>تكسي</small><strong>🚕</strong><b>اطلب كابتن ›</b></div><div class="b3" onclick="go('join')"><small>انضم لفريقنا</small><strong>🧑‍✈️</strong><b>سجّل ككابتن ›</b></div></div>
<div class="cats"><h2>كل المطاعم</h2><div class="cg">${(cats.length?cats:['مطاعم']).map(c=>`<div onclick="go('food')"><span>${ico({c})}</span>${esc(c)}</div>`).join('')}</div></div>
<div class="chips">${[['all','الكل'],['off','🏷️ خصم'],['open','مفتوح الآن']].map(c=>`<button class="${fq==c[0]?'a':''}" onclick="fq='${c[0]}';draw()">${c[1]}</button>`).join('')}<button onclick="go('taxi')">🚕 تكسي</button></div>
${D.length&&fq!='open'?`<div class="dk"><div class="row sp"><h2>خصومات %${top}</h2><button onclick="go('offers')">المزيد ›</button></div>${D.map(r=>rc(r,pc(r))).join('')}</div>`:''}
<h2>المطاعم</h2>${L.map(r=>rc(r,pc(r))).join('')||'<p class="mu">لا توجد مطاعم مطابقة.</p>'}`}
function cartv(v){if(cnt()&&rid)return go('co');v.innerHTML='<h1>السلة</h1><div class="card"><p class="mu">سلتك فارغة. اختر مطعمًا وأضف أصنافك.</p><button class="big" onclick="go(\'home\')">تصفح المطاعم</button></div>'}
let ph='';const api=async(p,b)=>{const r=await fetch('/api/auth/'+p,{method:'POST',headers:{'Content-Type':'application/json','x-token':localStorage.tok||''},body:JSON.stringify(b)}),d=await r.json().catch(()=>({}));if(!r.ok)throw d.e||'حدث خطأ';return d},
done=d=>{localStorage.tok=d.token;localStorage.cid=d.id;if(d.n&&!P.n){P.n=d.n;localStorage.p=JSON.stringify(P)}location.reload()};
function login(v){document.querySelector('nav').hidden=1;v.innerHTML=`<div class="lgn"><div class="brand">تكسي المتميز</div><h1>أهلاً بك 👋</h1><p class="mu">سجّل دخولك أو أنشئ حسابًا جديدًا</p><div id="gb"></div>${window.GCID?'<div class="or">— أو —</div>':''}<div class="card"><div class="tabs"><button id="t0" class="a" onclick="lt(0)">تسجيل الدخول</button><button id="t1" onclick="lt(1)">حساب جديد</button><button id="t2" onclick="lt(2)">واتساب</button></div><div id="f0"><input id="lp" type="tel" inputmode="numeric" autocomplete="tel" placeholder="رقم الهاتف مثال 0770 123 4567"><input id="lw" type="password" autocomplete="current-password" placeholder="كلمة المرور"><button class="big" onclick="lgn()">دخول</button></div><div id="f1" hidden><input id="rn" autocomplete="name" placeholder="الاسم"><input id="rp" type="tel" inputmode="numeric" autocomplete="tel" placeholder="رقم الهاتف مثال 0770 123 4567"><input id="rw" type="password" autocomplete="new-password" placeholder="كلمة المرور (6 أحرف فأكثر)"><button class="big" onclick="reg()">إنشاء الحساب</button><p class="mu">تدخل مباشرة، وتؤكد رقمك لاحقًا من صفحة الحساب.</p></div><div id="f2" hidden><div id="s1"><input id="lph" type="tel" inputmode="numeric" placeholder="رقم الواتساب مثال 0770 123 4567"><button class="big" onclick="wrq()">إرسال الرمز عبر واتساب</button></div><div id="s2" hidden><div class="mu">أرسلنا رمزًا من 6 أرقام إلى واتساب</div><input id="lc" inputmode="numeric" maxlength="6" placeholder="الرمز"><button class="big" onclick="wvf()">تأكيد ودخول</button><button class="l" style="width:100%;margin-top:8px" onclick="wrq()">إعادة الإرسال</button></div></div></div></div>`;
if(window.GCID&&!window.google){const g=document.createElement('script');g.src='https://accounts.google.com/gsi/client';g.onload=()=>{google.accounts.id.initialize({client_id:GCID,callback:r=>api('google',{cred:r.credential}).then(done).catch(alert)});google.accounts.id.renderButton($('#gb'),{theme:'outline',size:'large',width:300,locale:'ar'})};document.head.appendChild(g)}}
function lt(n){[0,1,2].forEach(i=>{$('#f'+i).hidden=i!=n;$('#t'+i).classList.toggle('a',i==n)})}
async function lgn(){try{done(await api('login',{phone:$('#lp').value,password:$('#lw').value}))}catch(e){alert(e)}}
async function reg(){try{done(await api('register',{name:$('#rn').value,phone:$('#rp').value,password:$('#rw').value}))}catch(e){alert(e)}}
async function vcard(){const el=$('#vc');if(!el)return;try{const m=await api('me',{});if(m.ver||!m.ph){el.innerHTML=m.ph?'<div class="card row sp"><b>✅ رقمك مؤكد</b><span class="mu">+'+esc(m.ph)+'</span></div>':'';return}el.innerHTML=`<div class="card"><div class="row sp"><b>⚠️ رقمك غير مؤكد</b><span class="mu">+${esc(m.ph)}</span></div><p class="mu">أكّد رقمك برمز يصل إلى واتساب.</p><div id="vq"><button class="big" onclick="vrq()">إرسال رمز التأكيد</button></div><div id="vf" hidden><input id="vcode" inputmode="numeric" maxlength="6" placeholder="الرمز"><button class="big" onclick="vcf()">تأكيد الرقم</button></div></div>`}catch(e){}}
async function vrq(){try{await api('verify-request',{});$('#vq').hidden=1;$('#vf').hidden=0}catch(e){alert(e)}}
async function vcf(){try{await api('verify-confirm',{code:$('#vcode').value});vcard()}catch(e){alert(e)}}
async function wrq(){try{const d=await api('wa-request',{phone:$('#lph').value||ph});ph=d.phone;$('#s1').hidden=1;$('#s2').hidden=0}catch(e){alert(e)}}
async function wvf(){try{done(await api('wa-verify',{phone:ph,code:$('#lc').value}))}catch(e){alert(e)}}
const out=()=>{localStorage.removeItem('tok');localStorage.removeItem('cid');location.reload()};
function offers(v){const L=Object.values(DB.offers||{}).filter(o=>o.on!==0);v.innerHTML='<h1>الخصومات</h1>'+(L.map(o=>`<div class="card row" onclick="${o.rid&&DB.rests[o.rid]?`rid='${o.rid}';cart={};go('menu')`:`go('food')`}"><div class="em">🏷️</div><div class="g"><b>${esc(o.t)}</b><div class="mu">${esc(o.d||'')}</div></div><span class="tag s">${o.pct}%</span></div>`).join('')||'<p class="mu">لا توجد خصومات حاليًا.</p>')+'<p class="mu">تُطبَّق الخصومات تلقائيًا عند إتمام الطلب.</p>'}
function cards(v){const C=Object.values(DB.cards||{}),M=Object.values(DB.cardorders||{}).sort((a,b)=>b.at-a.at);v.innerHTML='<h1>البطاقات</h1><div class="mu">بطاقات الرصيد والهدايا — يسلّمها لك فريقنا</div>'+(C.map(c=>`<div class="card row"><div class="em">${esc(c.e||'💳')}</div><div class="g"><b>${esc(c.n)}</b><div class="mu">${esc(c.d||'')}</div><b>${fmt(c.p)}</b></div><button onclick="buyC('${c.id}')">شراء</button></div>`).join('')||'<p class="mu">لا توجد بطاقات متاحة.</p>')+(M.length?'<h2>طلباتي من البطاقات</h2>':'')+M.map(m=>`<div class="card"><div class="row sp"><b>${esc(m.cn2)}</b><span class="tag ${stc(m.st)}">${m.st>0?'تم التسليم':m.st<0?'مرفوض':'قيد المعالجة'}</span></div>${m.code?`<div class="code">${esc(m.code)}</div>`:''}</div>`).join('')}
async function buyC(id){const c=DB.cards[id];if(!P.p||!P.n){alert('أكمل اسمك ورقمك من الحساب أولاً');return go('acct')}if(!confirm('شراء '+c.n+' بسعر '+fmt(c.p)+'؟ سيتواصل معك الدعم لإتمام الدفع.'))return;await set('cardorders','b'+Date.now(),{cid:CID,cn:P.n,cp:P.p,card:id,cn2:c.n,p:c.p,st:0,at:Date.now()});draw()}
function acct(v){const a=myApp();v.innerHTML=`<h1>الحساب</h1><div id="vc"></div><div class="card"><b>الملف الشخصي</b><input id="pn" placeholder="الاسم" value="${esc(P.n||'')}"><input id="pp" type="tel" placeholder="رقم الهاتف" value="${esc(P.p||'')}"><textarea id="pa" rows="2" placeholder="العنوان الافتراضي">${esc(P.a||'')}</textarea><button class="big" onclick="P={n:$('#pn').value.trim(),p:$('#pp').value.trim(),a:$('#pa').value.trim()};localStorage.p=JSON.stringify(P);alert('تم الحفظ')">حفظ</button></div><div class="card row sp" onclick="go('orders')"><b>🧾 طلباتي ورحلاتي</b><span>›</span></div><div class="card row sp" onclick="go('join')"><b>🧑‍✈️ ${a?'حالة طلب الكابتن':'التسجيل ككابتن'}</b>${a?`<span class="tag ${stc(a.st)}">${a.st>0?'مفعّل':a.st<0?'مرفوض':'قيد المراجعة'}</span>`:'<span>›</span>'}</div><div class="card row sp" onclick="document.querySelector('.tb button').click()"><b>🎨 مظهر التطبيق</b><span>›</span></div><button class="l big" onclick="out()">تسجيل الخروج</button>`;vcard()}
const DOC=[['idf','الهوية — الوجه الأمامي','image/*'],['idb','الهوية — الوجه الخلفي','image/*'],['lic','إجازة السوق','image/*'],['car1','السيارة من الأمام','image/*'],['car2','السيارة من الخلف','image/*'],['car3','داخل السيارة','image/*'],['v1','فيديو تعريفي: صوّر نفسك وأنت تمسك هويتك وتقول اسمك','video/*'],['v2','فيديو للسيارة من الخارج والداخل','video/*']];let dc={};
function join(v){const a=myApp();if(a&&a.st>=0){v.innerHTML=`<button class="l" onclick="go('acct')">رجوع</button><h1>طلب الكابتن</h1><div class="card"><div class="row sp"><b>${esc(a.n)}</b><span class="tag ${stc(a.st)}">${a.st>0?'مفعّل':'قيد المراجعة'}</span></div><div class="mu">${a.st>0?'تم تفعيل حسابك. حمّل تطبيق الكابتن وسجّل الدخول بهذه البيانات:':'استلمنا مستنداتك وسنراجعها قريبًا. سيظهر هنا قرار التفعيل.'}</div>${a.st>0?`<div class="code">رمز الدخول: ${esc(a.did)}<br>الرمز السري: ${esc(a.pin)}</div>`:''}</div>`;return}
dc={};v.innerHTML=`<button class="l" onclick="go('acct')">رجوع</button><h1>سجّل ككابتن</h1>${a&&a.st<0?`<div class="card off">رُفض طلبك السابق: ${esc(a.why||'')}. يمكنك التقديم من جديد.</div>`:''}<div class="card"><select id="jt"><option value="delivery">كابتن توصيل طعام</option><option value="taxi">كابتن تكسي</option><option value="both">توصيل وتكسي</option></select><input id="jn" placeholder="الاسم الثلاثي" value="${esc(P.n||'')}"><input id="jp" type="tel" placeholder="رقم الهاتف" value="${esc(P.p||'')}"><input id="jc" placeholder="المدينة"><input id="jm" placeholder="نوع السيارة وموديلها"><input id="jl" placeholder="رقم اللوحة"></div>${DOC.map(d=>`<label class="card up"><span><b>${d[1]}</b><div class="mu" id="s_${d[0]}">اضغط للاختيار</div></span><span>${d[2][0]=='v'?'🎥':'📷'}</span><input type="file" hidden accept="${d[2]}" onchange="upF('${d[0]}',this)"></label>`).join('')}<button class="big" onclick="sendJ()">إرسال الطلب</button>`}
async function upF(k,el){const f=el.files[0];if(!f)return;const s=$('#s_'+k);if(f.size>5e7){s.textContent='الملف كبير (الحد 50MB)';return}s.textContent='جارٍ الرفع…';try{dc[k]=await upl(f,1400);s.textContent='تم الرفع ✓';s.className='mu on'}catch(e){s.textContent='فشل الرفع، أعد المحاولة';s.className='mu off'}}
async function sendJ(){const g=i=>$('#'+i).value.trim();if(!g('jn')||!g('jp')||!g('jm')||!g('jl'))return alert('أكمل البيانات');const m=DOC.find(d=>!dc[d[0]]);if(m)return alert('ارفع: '+m[1]);if(!await set('apps','a'+Date.now(),{cid:CID,type:$('#jt').value,n:g('jn'),ph:g('jp'),city:g('jc'),car:g('jm'),plate:g('jl'),docs:dc,st:0,at:Date.now()}))return alert('تعذر الإرسال');go('join')}
AUTH.token?start(()=>{if(first||((['orders','cards','home','offers'].includes(view)||view=='acct'||(view=='join'&&myApp()&&myApp().st>=0))&&!busy())){first=0;draw()}}):draw();
</script></body></html>
