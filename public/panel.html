<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تكسي المتميز - لوحة التحكم</title>
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="themes.css"><style>#v>.tabs{position:sticky;top:0;z-index:30;margin:0 -14px 10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--bg);border-bottom:1px solid var(--bd)}</style><script src="config.js"></script><script src="shared.js"></script><script src="themes.js"></script></head>
<body><div id="app"><div id="v"></div></div>
<script>
auth('panel');const FR=new URLSearchParams(location.search).get('r');if(FR)document.documentElement.dataset.app=FR;let tab='o',ed=null,tmp='',ctl=null,rl=null;
const SUP=[['l','التتبع المباشر'],['o','طلبات الطعام'],['r','رحلات التكسي'],['d','الكباتن'],['h','الحوافز والمسابقات'],['v','تقييم الكباتن'],['w','شحن الكباتن'],['z','شحن الزبائن'],['t','الدعم'],['u','الزبائن'],['a','طلبات الكباتن'],['k','طلبات البطاقات']],
TABS={admin:[...SUP,['q','السحوبات'],['y','المحاسبة'],['m','المطاعم'],['s','الموظفون'],['f','العروض'],['x','كتالوج البطاقات'],['c','الإعدادات']],support:SUP,rest:[['o','الطلبات'],['m','المنيو'],['i','بيانات المطعم']]},
TT={admin:'صاحب التطبيق',support:'الدعم والمتابعة',rest:'صاحب المطعم'};
const isR=()=>AUTH.role=='rest',me=()=>DB.rests[AUTH.id]||{items:[]},val=i=>$('#'+i).value.trim();
const link=(p,t)=>p?`<a target="_blank" href="${nav(p)}">${t}</a>`:'';
const dsel=(k,o)=>isR()?'':`<select onchange="act('${k}','${o.id}',{did:this.value${k=='rides'&&o.st<1?',st:1':''}})"><option value="">تعيين كابتن</option>${Object.values(DB.drivers).map(d=>`<option value="${d.id}" ${o.did==d.id?'selected':''}>${esc(d.n)}${d.on?' (متصل)':''}</option>`).join('')}</select>`;
const nxt=(k,o,N,max)=>o.st>=0&&o.st<max?`<button onclick="act('${k}','${o.id}',{st:${o.st+1}})">${N[o.st]}</button>`:'';
const cxl=(k,o)=>!isR()&&o.st>=0&&o.st<4?`<button class="d" onclick="act('${k}','${o.id}',{st:-1})">إلغاء</button>`:'';
async function lg(){const r=$('#lr').value;signin(r,r=='rest'?val('li'):'',val('lp'));if(await load())draw();else{alert('بيانات الدخول غير صحيحة');logout()}}
function login(){$('#v').innerHTML='<h1>'+(TT[FR]||'لوحة التحكم')+'</h1><div class="card"><select id="lr" '+(FR?'hidden ':'')+' onchange="$(\'#li\').hidden=this.value!=\'rest\'"><option value="admin" '+(FR=='admin'?'selected':'')+'>صاحب التطبيق</option><option value="support" '+(FR=='support'?'selected':'')+'>الدعم والمتابعة</option><option value="rest" '+(FR=='rest'?'selected':'')+'>صاحب مطعم</option></select><input id="li" '+(FR=='rest'?'':'hidden')+' placeholder="رمز المطعم"><input id="lp" type="password" placeholder="الرمز السري"><button class="big" onclick="lg()">دخول</button></div>'}
const stat=()=>{const O=Object.values(DB.orders),R=Object.values(DB.rides),D=Object.values(DB.drivers),a=O.filter(o=>o.st>=0&&o.st<4).length,b=R.filter(o=>o.st>=0&&o.st<4).length,rev=O.filter(o=>o.st==4).reduce((s,o)=>s+o.tot,0)+R.filter(o=>o.st==4).reduce((s,o)=>s+o.fare,0);return `<div class="stats"><div class="stat"><b>${a}</b>طلبات نشطة</div><div class="stat"><b>${b}</b>رحلات نشطة</div><div class="stat"><b>${D.filter(d=>d.on).length} / ${D.length}</b>كباتن متصلون</div><div class="stat"><b>${fmt(rev)}</b>إيرادات منجزة</div><div class="stat"><b>${fmt(O.concat(R).reduce((s,o)=>s+(o.com||0)+(o.rcom||0),0))}</b>عمولات التطبيق</div></div>`};
const mt=u=>/\.(mp4|webm|mov)$/.test(u)?`<video controls playsinline preload="metadata" src="${u}" style="width:100%;border-radius:12px;max-height:240px;margin-top:6px"></video>`:`<a href="${u}" target="_blank"><img src="${u}" alt="" style="width:100%;border-radius:12px;max-height:180px;object-fit:cover;margin-top:6px"></a>`;
const DL={idf:'الهوية (أمام)',idb:'الهوية (خلف)',lic:'إجازة السوق',car1:'السيارة (أمام)',car2:'السيارة (خلف)',car3:'داخل السيارة',v1:'فيديو التعريف',v2:'فيديو السيارة'},TY={delivery:'توصيل طعام',taxi:'تكسي',both:'توصيل وتكسي'},sc=s=>s>0?'s':s<0?'x':'w';
function appT(){return Object.values(DB.apps||{}).sort((a,b)=>b.at-a.at).map(a=>`<div class="card"><div class="row sp"><b>${esc(a.n)}</b><span class="tag ${sc(a.st)}">${a.st>0?'مفعّل':a.st<0?'مرفوض':'بانتظار المراجعة'}</span></div><div class="mu">${TY[a.type]||''} • ${esc(a.ph)} • ${esc(a.city||'')}<br>${esc(a.car)} • لوحة ${esc(a.plate)}</div><div class="stats">${Object.entries(a.docs||{}).map(([k,u])=>`<div class="stat">${DL[k]||k}${mt(u)}</div>`).join('')}</div>${a.st==0?`<div class="bt"><button onclick="appr('${a.id}')">✔ تفعيل الحساب</button><button class="d" onclick="rjc('${a.id}')">رفض</button></div>`:a.st>0?`<div class="mu">رمز الدخول ${esc(a.did)} • السري ${esc(a.pin)}</div>`:`<div class="mu off">${esc(a.why||'')}</div>`}</div>`).join('')||'<p class="mu">لا توجد طلبات.</p>'}
async function appr(id){const a=DB.apps[id],d='d'+Date.now().toString(36),pin=String(crypto.getRandomValues(new Uint32Array(1))[0]%9000+1000);await act('drivers',d,{n:a.n,ph:a.ph,car:a.car+' '+a.plate,type:a.type,pin,on:0});await act('apps',id,{st:1,did:d,pin})}
const rjc=id=>{const w=prompt('سبب الرفض');w&&act('apps',id,{st:-1,why:w})};
function cardT(){return Object.values(DB.cardorders||{}).sort((a,b)=>b.at-a.at).map(m=>`<div class="card"><div class="row sp"><b>${esc(m.cn2)} • ${fmt(m.p)}</b><span class="tag ${sc(m.st)}">${m.st>0?'تم التسليم':m.st<0?'مرفوض':'جديد'}</span></div><div class="mu">${esc(m.cn)} • ${esc(m.cp)}</div>${m.code?`<div class="code">${esc(m.code)}</div>`:''}${m.st==0?`<input id="cd${m.id}" placeholder="كود البطاقة الذي سيراه الزبون"><div class="bt"><button onclick="act('cardorders','${m.id}',{st:1,code:val('cd${m.id}')})">تسليم</button><button class="d" onclick="act('cardorders','${m.id}',{st:-1})">رفض</button></div>`:''}</div>`).join('')||'<p class="mu">لا توجد طلبات بطاقات.</p>'}
function offT(){return `<div class="card"><b>إضافة عرض</b><input id="ot" placeholder="عنوان العرض"><input id="od" placeholder="وصف"><input id="op" type="number" placeholder="نسبة الخصم %"><select id="or"><option value="">كل المطاعم</option>${Object.values(DB.rests).map(r=>`<option value="${r.id}">${esc(r.n)}</option>`).join('')}</select><button onclick="val('ot')&&+val('op')&&act('offers','f'+Date.now().toString(36),{t:val('ot'),d:val('od'),pct:+val('op'),rid:$('#or').value,on:1})">إضافة</button></div>`+Object.values(DB.offers||{}).map(o=>`<div class="card row sp"><div><b>${esc(o.t)}</b> <span class="tag s">${o.pct}%</span><div class="mu">${esc(o.d||'')} ${o.rid&&DB.rests[o.rid]?'• '+esc(DB.rests[o.rid].n):'• كل المطاعم'}</div></div><div class="bt"><button class="l" onclick="act('offers','${o.id}',{on:${o.on===0?1:0}})">${o.on===0?'تفعيل':'إيقاف'}</button><button class="d" onclick="del('offers','${o.id}')">حذف</button></div></div>`).join('')}
function catT(){return `<div class="card"><b>إضافة بطاقة</b><input id="bn" placeholder="اسم البطاقة"><input id="bp" type="number" placeholder="السعر"><input id="bd" placeholder="وصف"><input id="bcat" placeholder="الفئة (مثال: رصيد، ألعاب، خدمات)"><input id="be" placeholder="إيموجي (💳)"><button onclick="val('bn')&&+val('bp')&&act('cards','x'+Date.now().toString(36),{n:val('bn'),p:+val('bp'),d:val('bd'),cat:val('bcat'),e:val('be')||'💳'})">إضافة</button></div>`+Object.values(DB.cards||{}).map(c=>`<div class="card row sp"><div><b>${esc(c.e||'💳')} ${esc(c.n)}</b><div class="mu">${fmt(c.p)}</div></div><button class="d" onclick="del('cards','${c.id}')">حذف</button></div>`).join('')}
function ordT(){const L=Object.values(DB.orders).sort((a,b)=>b.at-a.at);return L.map(o=>`<div class="card"><div class="row sp"><b>${esc(o.rn)}</b><span class="tag">${o.st<0?'ملغي':FS[o.st]}</span></div><div>${o.its.map(i=>i.q+' × '+esc(i.n)).join('، ')}</div>${isR()?'':`<div class="mu">${esc(o.cn)} • ${esc(o.cp)} • ${link(o.loc,'موقع الزبون')}<br>${esc(o.note||'')}</div>`}<div class="row sp" style="margin-top:6px"><b>${fmt(o.tot)}</b><div class="bt">${dsel('orders',o)}${cxl('orders',o)}${nxt('orders',o,['قبول وبدء التحضير','جاهز للاستلام','استلمه الكابتن','تم التسليم'],isR()?2:4)}</div></div></div>`).join('')||'<p class="mu">لا توجد طلبات.</p>'}
function rideT(){return Object.values(DB.rides).sort((a,b)=>b.at-a.at).map(o=>`<div class="card"><div class="row sp"><b>🚕 ${o.km} كم</b><span class="tag">${o.st<0?'ملغية':RS[o.st]}</span></div><div class="mu">${esc(o.cn)} • ${esc(o.cp)} • ${link(o.from,'الانطلاق')} • ${link(o.to,'الوجهة')}</div><div class="row sp" style="margin-top:6px"><b>${fmt(o.fare)}</b><div class="bt">${dsel('rides',o)}${cxl('rides',o)}${nxt('rides',o,['','وصل الكابتن','بدء الرحلة','إنهاء الرحلة'],4).replace(/<button[^>]*>\s*<\/button>/,'')}</div></div></div>`).join('')||'<p class="mu">لا توجد رحلات.</p>'}
function drvT(){const A=AUTH.role=='admin';return (A?`<div class="card"><b>إضافة كابتن</b><input id="dn" placeholder="الاسم"><input id="dp" placeholder="الهاتف"><input id="dc" placeholder="السيارة ولوحتها"><input id="di" placeholder="رمز الدخول (إنجليزي)"><input id="dk" placeholder="الرمز السري"><button onclick="addD()">إضافة</button></div>`:'')+Object.values(DB.drivers).map(d=>`<div class="card row sp"><div><b>${esc(d.n)}</b> <span class="tag ${d.on?'on':'off'}">${d.on?'متصل':'غير متصل'}</span><div class="mu">${esc(d.ph||'')} • ${esc(d.car||'')} • الرصيد <b class="${(d.bal||0)<=DB.cfg.minBal?'off':'on'}">${fmt(d.bal||0)}</b>${(d.bal||0)<=DB.cfg.minBal?' ⛔ موقوف':''} ${A?'• رمز: '+esc(d.id)+' • سري: '+esc(d.pin):''}</div>${link(d.loc,'آخر موقع')}</div>${A?`<div class="bt"><button onclick="chg('${d.id}')">شحن</button>${d.tfa?`<button class="l" onclick="confirm('إلغاء المصادقة الثنائية لهذا الكابتن؟')&&act('drivers','${d.id}',{tfaReset:1})">🔐 إلغاء 2FA</button>`:''}<button class="d" onclick="del('drivers','${d.id}')">حذف</button></div>`:''}</div>`).join('')}
function addD(){const i=val('di');if(!i||!val('dn')||!val('dk'))return alert('أدخل الاسم والرمز والسري');act('drivers',i,{n:val('dn'),ph:val('dp'),car:val('dc'),pin:val('dk'),on:0})}
const del=(k,id)=>confirm('تأكيد الحذف؟')&&act(k,id,null);
function tkT(){return Object.values(DB.tickets).sort((a,b)=>b.at-a.at).map(t=>`<div class="card"><div class="mu">${esc(t.cn)} • ${esc(t.cp)} • طلب ${esc(t.oid||'')}</div>${esc(t.msg)}<input id="rp${t.id}" placeholder="اكتب الرد" value="${esc(t.rep||'')}"><button onclick="act('tickets','${t.id}',{rep:val('rp${t.id}'),st:1})">${t.st?'تعديل الرد':'إرسال الرد'}</button></div>`).join('')||'<p class="mu">لا توجد رسائل.</p>'}
function restT(){return `<div class="card"><b>إضافة مطعم</b><input id="rn" placeholder="اسم المطعم"><input id="rc" placeholder="نوع الأكل"><input id="rk" placeholder="الرمز السري لصاحب المطعم"><button onclick="addR()">إضافة</button></div>`+Object.values(DB.rests).map(r=>`<div class="card row sp"><div><b>${esc(r.n)}</b><div class="mu">رمز الدخول: ${esc(r.id)} • السري: ${esc(r.pin)} • ${(r.items||[]).length} صنف</div><div class="row" style="margin-top:6px"><input id="rp${r.id}" type="number" min="0" max="100" step="0.5" placeholder="عمولة خاصة % (فارغ = ${DB.cfg.restPct}%)" value="${r.pct!=null?r.pct:''}"><button class="l" onclick="act('rests','${r.id}',{pct:$('#rp${r.id}').value})">حفظ</button></div></div><div class="bt"><button class="l" onclick="menuImport('${r.id}')">⬆ استيراد منيو</button><button class="d" onclick="del('rests','${r.id}')">حذف</button></div></div>`).join('')}
function addR(){if(!val('rn')||!val('rk'))return alert('أدخل الاسم والرمز السري');const id='r'+Date.now().toString(36);act('rests',id,{n:val('rn'),c:val('rc'),pin:val('rk'),open:1,items:[]})}
function staffT(){return `<div class="card"><b>إضافة موظف دعم</b><input id="sn" placeholder="الاسم"><input id="sk" placeholder="الرمز السري"><button onclick="if(val('sn')&&val('sk'))act('staff','s'+Date.now().toString(36),{n:val('sn'),pin:val('sk')})">إضافة</button></div>`+Object.values(DB.staff).map(s=>`<div class="card row sp"><div><b>${esc(s.n)}</b><div class="mu">السري: ${esc(s.pin)}</div></div><button class="d" onclick="del('staff','${s.id}')">حذف</button></div>`).join('')}
function cfgT(){const c=DB.cfg;return `<div class="card"><b>تسعير التوصيل والتكسي</b>${[['base','الفتح الأساسي (د.ع)'],['km','سعر الكم للتكسي'],['foodKm','سعر الكم لتوصيل الطعام'],['min','أقل أجرة']].map(f=>`<label class="mu">${f[1]}<input id="c_${f[0]}" type="number" value="${c[f[0]]}"></label>`).join('')}<label class="row" style="margin-top:8px"><input id="c_auto" type="checkbox" ${c.auto===0?'':'checked'}> تعيين أقرب كابتن تلقائيًا</label><label class="mu">أقصى مسافة للبحث (كم)<input id="c_maxKm" type="number" value="${c.maxKm||10}"></label><label class="mu">غرامة رفض الكابتن لطلب توصيل طعام معيَّن له (د.ع، تُخصم من محفظته — 0 = بدون غرامة)<input id="c_rejFee" type="number" min="0" value="${c.rejFee||0}"></label><label class="mu">الثيم الافتراضي لكل التطبيقات<select id="c_theme">${THEMES.map(t=>`<option value="${t[0]}" ${(c.theme||'auto')==t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></label><button onclick="act('cfg','x',{base:+val('c_base'),km:+val('c_km'),foodKm:+val('c_foodKm'),min:+val('c_min'),auto:$('#c_auto').checked?1:0,maxKm:+val('c_maxKm')||10,rejFee:Math.max(0,+val('c_rejFee')||0),theme:val('c_theme')})">حفظ</button></div>`+cfg2()}
const chg=id=>{const a=prompt('المبلغ (موجب للشحن، سالب للخصم)');a&&+a&&act('wallet',id,{amt:+a,why:+a>0?'شحن من لوحة التحكم':'خصم من لوحة التحكم'})};
const payAdd=()=>val('pn')&&act('cfg','x',{pay:[...(DB.cfg.pay||[]),{n:val('pn'),d:$('#pd').value.trim()}]}),payDel=i=>act('cfg','x',{pay:(DB.cfg.pay||[]).filter((_,j)=>j!=i)});
function cfg2(){const c=DB.cfg;return `<div class="card"><b>العمولات (تتزامن فورًا مع كل الأجهزة)</b>${[['appPct','عمولة التطبيق على توصيل الطعام % (من أجرة التوصيل، تُخصم من محفظة الكابتن)'],['restPct','عمولة المطاعم % (على صاحب المطعم، من مبيعات الأصناف — الافتراضي 5)'],['taxiPct','عمولة التكسي % (من الأجرة، تُخصم من محفظة الكابتن — الافتراضي 5)'],['minBal','حد إيقاف حساب الكابتن (د.ع) — يُوقَف عند هذا الرصيد أو أقل'],['minWd','الحد الأدنى لسحب رصيد الكابتن (د.ع) — يُسمح بطلب سحب عند بلوغه']].map(f=>`<label class="mu">${f[1]}<input id="c_${f[0]}" type="number" value="${f[0]=='minBal'?Math.abs(c.minBal):f[0]=='minWd'?(c.minWd||15000):c[f[0]]}"></label>`).join('')}<button onclick="act('cfg','x',{appPct:+val('c_appPct'),restPct:+val('c_restPct'),taxiPct:+val('c_taxiPct'),minBal:-Math.abs(+val('c_minBal')),minWd:+val('c_minWd')||15000})">حفظ العمولات</button></div><div class="card"><b>🛡️ أمان الحسابات والأجهزة</b><label class="mu">أقصى عدد أجهزة لكل حساب زبون<input id="c_maxDev" type="number" min="1" max="20" value="${c.maxDev||3}"></label><label class="row" style="margin-top:8px"><input id="c_vpn" type="checkbox" ${c.vpnBlock===0?'':'checked'}> منع التشغيل عبر VPN / بروكسي</label><label class="row" style="margin-top:8px"><input id="c_tg" type="checkbox" ${c.timeGuard===0?'':'checked'}> منع التلاعب بوقت الجهاز</label><label class="mu">فرق الوقت المسموح (دقائق)<input id="c_tol" type="number" min="1" max="60" value="${c.timeTol||3}"></label><button onclick="act('cfg','x',{maxDev:+val('c_maxDev')||3,vpnBlock:$('#c_vpn').checked?1:0,timeGuard:$('#c_tg').checked?1:0,timeTol:+val('c_tol')||3})">حفظ إعدادات الأمان</button></div><div class="card"><label class="row"><input type="checkbox" ${c.req2fa?'checked':''} onchange="act('cfg','x',{req2fa:this.checked?1:0})"> إلزام الكباتن بتفعيل المصادقة الثنائية قبل طلب سحب الرصيد</label></div><div class="card"><b>أنواع الرحلات (معامل السعر)</b><div class="mu">سعر الرحلة = (الفتح + المسافة × سعر الكم) × المعامل</div>${(c.rt||[]).map(x=>`<label class="mu">${esc(x.n)} — ${esc(x.d||'')}<input id="rm_${x.id}" type="number" step="0.01" value="${x.m}"></label>`).join('')}<button onclick="act('cfg','x',{rt:(DB.cfg.rt||[]).map(x=>({...x,m:+val('rm_'+x.id)||1}))})">حفظ الأنواع</button></div><div class="card"><b>طرق الشحن (محفظة الكابتن ومحفظة الزبون)</b><div class="mu">تظهر للكابتن عند إيقاف حسابه (مثل زين كاش، ماستر كارد، رقم الدعم)</div>${(c.pay||[]).map((p,i)=>`<div class="row sp"><div><b>${esc(p.n)}</b><div class="mu" style="white-space:pre-line">${esc(p.d)}</div></div><button class="d" onclick="payDel(${i})">حذف</button></div>`).join('')}<input id="pn" placeholder="اسم الطريقة (زين كاش / ماستر كارد / الدعم)"><textarea id="pd" rows="2" placeholder="التفاصيل: الرقم، اسم المستلم، التعليمات"></textarea><button onclick="payAdd()">إضافة طريقة شحن</button></div>`}

 ${R.filter(r=>r.p>0).map(r=>{const pc=Math.min(100,Math.round(r.p/n.trips*100));return `<div class="rvw"><div class="row sp"><b>${esc(r.d.n)}</b><b class="${r.p>=n.trips?'on':''}">${r.p} / ${n.trips}</b></div><div class="pbar"><i style="width:${pc}%"></i></div>${r.w?`<span class="tag s">صُرفت ${fmt(r.w.amt)} • ${new Date(r.w.at).toLocaleDateString('ar-IQ')}</span>`:r.p>=n.trips?(A?`<button onclick="incPay('${n.id}','${r.d.id}')">💰 صرف الجائزة ${fmt(n.amt)}</button>`:'<span class="tag k">بانتظار الصرف</span>'):''}</div>`}).join('')||'<div class="mu">لم يبدأ أي كابتن بعد.</div>'}</div>`}).join('')||'<p class="mu">لا توجد مسابقات. أضف أول مسابقة من النموذج أعلاه.</p>')}
function ratT(){const O=[...Object.values(DB.rides).map(o=>({...o,g:'🚕 تكسي'})),...Object.values(DB.orders).map(o=>({...o,g:'🍽️ '+(o.rn||'توصيل')}))],
 D=Object.values(DB.drivers).map(d=>{const dn=O.filter(o=>o.did==d.id&&o.st==4),rs=dn.filter(o=>o.rated>0).sort((a,b)=>b.at-a.at);return{d,n:dn.length,rs,avg:rs.length?rs.reduce((s,o)=>s+o.rated,0)/rs.length:0}}).sort((a,b)=>b.n-a.n);
 return `<div class="stats"><div class="stat"><b>${D.length}</b>كباتن</div><div class="stat"><b>${D.reduce((s,x)=>s+x.n,0)}</b>رحلات وطلبات منجزة</div><div class="stat"><b>${D.reduce((s,x)=>s+x.rs.length,0)}</b>تقييمات الزبائن</div></div>`+D.map(x=>`<div class="card"><div class="row sp"><div><b>${esc(x.d.n)}</b> <span class="tag ${x.d.on?'on':'off'}">${x.d.on?'متصل':'غير متصل'}</span><div class="mu">${esc(x.d.ph||'')} • ${esc(x.d.car||'')}</div></div><div style="text-align:left"><b>${x.n}</b> <span class="mu">رحلة</span><div>${x.rs.length?'⭐ <b>'+x.avg.toFixed(1)+'</b> <span class="mu">('+x.rs.length+')</span>':'<span class="mu">بلا تقييم</span>'}</div></div></div>${x.rs.length?`<details ${ro[x.d.id]?'open':''} ontoggle="this.open?ro['${x.d.id}']=1:delete ro['${x.d.id}']"><summary>تقييمات وملاحظات الزبائن (${x.rs.length})</summary>${x.rs.map(o=>`<div class="rvw"><div class="row sp"><span>${'★'.repeat(o.rated)}${'☆'.repeat(5-o.rated)}</span><span class="mu">${esc(o.g)} • ${new Date(o.at).toLocaleDateString('ar-IQ')}</span></div><div class="mu">${esc(o.cn||'')} • ${esc(o.cp||'')}</div><div>${o.rnote?esc(o.rnote):'<span class="mu">بدون ملاحظة</span>'}</div></div>`).join('')}</details>`:''}</div>`).join('')||'<p class="mu">لا يوجد كباتن.</p>'}
function ctopT(){return Object.values(DB.ctop||{}).sort((a,b)=>b.at-a.at).map(t=>{const c=(DB.customers||{})[t.cid]||{};return `<div class="card"><div class="row sp"><b>${esc(c.n||t.cid)}</b><span class="tag ${sc(t.st)}">${t.st>0?'تم الشحن':t.st<0?'مرفوض':'جديد'}</span></div><div class="mu">${esc(c.ph||'')} • الرصيد ${fmt(c.bal||0)}<br>المبلغ: <b>${fmt(t.amt)}</b> • ${t.m=='zain'?'زين كاش':'ماستر كارد'} • ${new Date(t.at).toLocaleString('ar-IQ')}${t.ref?'<br>رقم العملية: '+esc(t.ref):''}</div>${t.img?mt(t.img):''}${t.st==0?`<div class="bt" style="margin-top:8px"><button onclick="act('ctop','${t.id}',{st:1})">✔ إضافة ${fmt(t.amt)} للمحفظة</button><button class="d" onclick="const w=prompt('سبب الرفض');w&&act('ctop','${t.id}',{st:-1,why:w})">رفض</button></div>`:t.st<0?`<div class="mu off">${esc(t.why||'')}</div>`:''}</div>`}).join('')||'<p class="mu">لا توجد طلبات شحن من الزبائن.</p>'}
const cchg=id=>{const m=prompt('المبلغ (موجب للشحن، سالب للخصم)');m&&+m&&act('cwallet',id,{amt:+m,why:+m>0?'شحن من لوحة التحكم':'خصم من لوحة التحكم'})};
let uo={};
const cdv=(id,a,dev,m)=>(a!='reset'||confirm(m||'تسجيل خروج الزبون من كل أجهزته؟'))&&act('cdev',id,{a,dev});
const DST=x=>x.st==1?['محظور','x']:x.st==2?['أُزيل','w']:(Date.now()-(x.last||0)>2592e6?['خامل','w']:['نشط','s']);
function devBox(c,A){const D=Object.values(c.devs||{}).sort((a,b)=>(b.last||0)-(a.last||0)),S=(c.sess||[]).slice(-15).reverse(),T=x=>x?new Date(x).toLocaleString('ar-IQ'):'—',MM={pw:'كلمة المرور',google:'Google',wa:'واتساب',reg:'حساب جديد'},WW={limit:'تجاوز حد الأجهزة',blocked:'جهاز محظور',nodev:'جهاز غير معروف'};
 return `<div style="margin-top:8px">${D.map(x=>{const s=DST(x);return `<div class="card" style="margin:6px 0"><div class="row sp"><b>${esc(x.nm||'جهاز')} ${esc(x.os||'')}</b><span class="tag ${s[1]}">${s[0]}</span></div><div class="mu">${x.br?esc(x.br)+' • ':''}${x.app?'تطبيق':'متصفح'} • ${esc(x.scr||'')} • ${esc(x.lang||'')}<br>IP: <b dir="ltr" style="user-select:all">${esc(x.ip||'—')}</b>${x.cn?' • '+esc(x.cn):''}${x.city?' • '+esc(x.city):''}${x.isp?' • '+esc(x.isp):''}${x.tzm?'<br><span class="off">⚠ توقيت الجهاز ('+esc(x.tz||'')+') لا يطابق موقع الـ IP — احتمال VPN</span>':''}<br>أول دخول: ${T(x.first)} • آخر نشاط: ${T(x.last)}<br>معرّف: <span dir="ltr" style="user-select:all">${esc(String(x.id).slice(0,10))}…</span></div>${A?`<div class="bt" style="margin-top:6px">${!x.st?`<button class="l" onclick="cdv('${c.id}','rm','${esc(x.id)}')">إزالة</button><button class="d" onclick="cdv('${c.id}','block','${esc(x.id)}')">حظر</button>`:x.st==1?`<button onclick="cdv('${c.id}','unblock','${esc(x.id)}')">فك الحظر</button>`:''}</div>`:''}</div>`}).join('')||'<p class="mu">لا توجد أجهزة مسجّلة.</p>'}
 ${(c.att||[]).length?`<div class="card" style="margin:6px 0"><b class="off">محاولات دخول مرفوضة (جهاز زائد): ${c.att.length}</b>${c.att.slice(-5).reverse().map(a=>`<div class="mu">${T(a.at)} • ${esc(a.nm||'')} ${esc(a.os||'')} • IP <span dir="ltr">${esc(a.ip||'')}</span></div>`).join('')}</div>`:''}
 <b>آخر جلسات الدخول</b>${S.map(x=>`<div class="row sp mu" style="padding:5px 0;border-bottom:1px solid var(--bd)"><span>${x.ok?'✅':'⛔'} ${esc(MM[x.m]||x.m||'')}${x.ok?'':' — '+esc(WW[x.why]||x.why||'')}<br>${esc(x.nm||'')} ${esc(x.os||'')} • <span dir="ltr">${esc(x.ip||'')}</span>${x.cn?' • '+esc(x.cn):''}</span><span>${T(x.at)}</span></div>`).join('')||'<div class="mu">لا توجد جلسات مسجّلة.</div>'}
 ${A&&D.some(x=>!x.st)?`<button class="d" style="margin-top:8px" onclick="cdv('${c.id}','reset')">تسجيل خروج من كل الأجهزة</button>`:''}</div>`}
function usrT(){const A=AUTH.role=='admin',mx=DB.cfg.maxDev||3;return Object.values(DB.customers||{}).sort((a,b)=>(b.last||0)-(a.last||0)).map(c=>{const n=Object.values(c.devs||{}).filter(x=>!x.st&&Date.now()-(x.last||0)<2592e6).length,has=A&&(c.devs||c.sess);return `<div class="card"><div class="row sp"><div><b>${esc(c.n||'بدون اسم')}</b><div class="mu">${c.ph?'واتساب: '+esc(c.ph):'جوجل: '+esc(c.em||'')} • آخر دخول ${new Date(c.last||0).toLocaleDateString('ar-IQ')}<br>رصيد المحفظة: <b>${fmt(c.bal||0)}</b>${has?` • الأجهزة: <b class="${n>=mx?'off':''}">${n}/${mx}</b>`:''}</div></div><div class="bt">${A?`<button onclick="cchg('${c.id}')">شحن</button>`:''}${has?`<button class="l" onclick="uo['${c.id}']=!uo['${c.id}'];draw()">${uo[c.id]?'إخفاء':'الأجهزة والجلسات'}</button>`:''}</div></div>${has&&uo[c.id]?devBox(c,A):''}</div>`}).join('')||'<p class="mu">لا يوجد زبائن مسجلون بعد.</p>'}

function liveT(){return `<div id="lm" class="map" style="height:56vh;border-radius:16px;margin-bottom:10px"></div><div id="ll"></div>`}
function liveUpd(){const el=$('#lm');if(!el)return;lf(()=>{const m=initMap(el,BG,12);el._lk=el._lk||{};const K=el._lk,keep={},now=Date.now(),
 act=[...Object.values(DB.orders).filter(o=>o.did&&o.st>=1&&o.st<4).map(o=>({d:o.did,t:'🍽️ '+(o.rn||'طلب')+' ← '+(o.cn||''),to:o.st<3?o.rloc:o.loc,s:o.st<3?'إلى المطعم':'إلى الزبون'})),...Object.values(DB.rides).filter(r=>r.did&&r.st>=1&&r.st<4).map(r=>({d:r.did,t:'🚕 '+(r.cn||'رحلة'),to:r.st<3?r.from:r.to,s:r.st<3?'إلى الزبون':'بالرحلة'}))],B={};act.forEach(a=>B[a.d]=a);
 const ic=(e,g)=>L.divIcon({className:'',html:`<div style="font-size:26px;${g?'filter:grayscale(1);opacity:.6':''}">${e}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
 const put=(k,p,i,tt)=>{keep[k]=1;let x=K[k];if(!x)x=K[k]=L.marker([p.lat,p.lng],{icon:i}).addTo(m);else{x.setLatLng([p.lat,p.lng]);x.setIcon(i)}x.bindTooltip(tt)};
 const D=Object.values(DB.drivers).filter(d=>d.loc&&Number.isFinite(+d.loc.lat));
 D.forEach(d=>{const b=B[d.id],old=d.locAt&&now-d.locAt>12e4;put('d'+d.id,d.loc,ic(b?'🚕':'🚖',!d.on||old),esc(d.n||'')+(b?' — '+b.s:d.on?' — متصل':' — غير متصل'))});
 act.forEach((a,i)=>{if(a.to&&Number.isFinite(+a.to.lat))put('t'+i,a.to,ic('📍'),esc(a.t))});
 Object.keys(K).forEach(k=>{if(!keep[k]){m.removeLayer(K[k]);delete K[k]}});
 if(!el._fit&&D.length){el._fit=1;m.fitBounds(L.latLngBounds(D.map(d=>[d.loc.lat,d.loc.lng])),{padding:[30,30],maxZoom:15})}
 const on=D.filter(d=>d.on).length,ll=$('#ll');if(ll)ll.innerHTML=`<div class="row sp"><b>الكباتن المتصلون: ${on} / ${Object.keys(DB.drivers).length}</b><b>المهام الجارية: ${act.length}</b></div>`+(act.map(a=>{const d=DB.drivers[a.d]||{},e=d.loc&&a.to?eta(d.loc,a.to):null;return `<div class="card"><div class="row sp"><b>${esc(d.n||'')}</b><span class="tag">${a.s}</span></div><div class="mu">${esc(a.t)}${e?' • '+e.min+' د • '+e.km.toFixed(1)+' كم':''}</div><div class="bt">${d.ph?`<a class="btn l" href="tel:${esc(d.ph)}">📞</a>`:''}${d.loc?`<button class="l" onclick="$('#lm')._m.setView([${d.loc.lat},${d.loc.lng}],16)">عرض على الخريطة</button>`:''}</div></div>`}).join('')||'<p class="mu">لا توجد مهام جارية الآن.</p>')})}
function draw(){if(!AUTH.pin)return login();const T=TABS[AUTH.role];if(!T)return logout();if(!T.some(t=>t[0]==tab))tab=T[0][0];
$('#v').innerHTML=`<div class="row sp"><h1>${TT[AUTH.role]}</h1><button class="l" onclick="logout()">خروج</button></div><div class="tabs">${T.map(t=>`<button class="${t[0]==tab?'a':''}" onclick="tab='${t[0]}';ed=null;draw()">${t[1]}</button>`).join('')}</div>`+(!isR()&&tab=='o'?stat():'')+({l:liveT,o:ordT,r:rideT,d:drvT,w:walT,q:wdT,y:accT,u:usrT,h:incT,v:ratT,z:ctopT,t:tkT,m:isR()?menuT:restT,a:appT,k:cardT,f:offT,x:catT,s:staffT,c:cfgT,i:infoT})[tab]();
if(tab=='l')liveUpd();
if(tab=='i'&&isR())ctl=mapPick($('#pm'),rl||BG,p=>{rl=p.a},{a:rl})}
let first=1;start(ch=>{if(AUTH.pin&&tab=='l'&&!first){liveUpd();return}if(AUTH.pin&&(first||(ch&&'ordrtakuwqyzhv'.includes(tab)&&!busy()))){first=0;draw()}else if(!AUTH.pin&&first){first=0;draw()}});
</script></body></html>
