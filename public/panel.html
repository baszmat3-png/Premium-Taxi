<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تكسي المتميز - لوحة التحكم</title>
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="themes.css"><style>#app{max-width:1100px}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}#pm .sheet,.sheet#pm{z-index:60}#v>.tabs{position:sticky;top:0;z-index:30;margin:0 -14px 10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--bg);border-bottom:1px solid var(--bd)}.chp{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;padding:10px 4px}.cb2{max-width:82%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;line-height:1.5}.cb2 small{display:block;opacity:.6;font-size:11px;margin-top:3px}.cb2 img{display:block;width:220px;max-width:100%;border-radius:12px;margin-bottom:4px}.cb2.c{align-self:flex-start;background:var(--cd);border:1px solid var(--bd)}.cb2.s{align-self:flex-end;background:#27b4cd;color:#06222b}.chb{display:flex;gap:8px;align-items:center;position:sticky;bottom:0;background:var(--bg);padding:8px 0}.chb input{flex:1;margin:0}</style><script src="config.js"></script><script src="shared.js"></script><script src="themes.js"></script></head>
<body><div id="app"><div id="v"></div></div>
<script>
auth('panel');const FR=new URLSearchParams(location.search).get('r');if(FR)document.documentElement.dataset.app=FR;let tab='D',ed=null,tmp='',ctl=null,rl=null;
const SUP=[['D','🏠 الرئيسية'],['j','💬 محادثات الدعم'],['l','التتبع المباشر'],['o','طلبات الطعام'],['r','رحلات التكسي'],['d','الكباتن'],['h','الحوافز والمسابقات'],['v','تقييم الكباتن'],['w','شحن الكباتن'],['z','شحن الزبائن'],['t','الدعم'],['u','الزبائن'],['a','طلبات الكباتن'],['k','طلبات البطاقات']],
TABS={admin:[...SUP,['q','السحوبات'],['y','المحاسبة'],['m','المطاعم'],['s','الموظفون'],['f','العروض'],['x','كتالوج البطاقات'],['n','⚡ المتغيرات'],['c','الإعدادات']],support:SUP,rest:[['o','الطلبات'],['m','المنيو'],['i','بيانات المطعم']]},
TT={admin:'صاحب التطبيق',support:'الدعم والمتابعة',rest:'صاحب المطعم'};
const isR=()=>AUTH.role=='rest',me=()=>DB.rests[AUTH.id]||{items:[]},val=i=>$('#'+i).value.trim();
const link=(p,t)=>p?`<a target="_blank" href="${nav(p)}">${t}</a>`:'';
const dsel=(k,o)=>isR()?'':`<select onchange="act('${k}','${o.id}',{did:this.value${k=='rides'&&o.st<1?',st:1':''}})"><option value="">تعيين كابتن</option>${Object.values(DB.drivers).map(d=>`<option value="${d.id}" ${o.did==d.id?'selected':''}>${esc(d.n)}${d.on?' (متصل)':''}</option>`).join('')}</select>`;
const nxt=(k,o,N,max)=>o.st>=0&&o.st<max?`<button onclick="act('${k}','${o.id}',{st:${o.st+1}})">${N[o.st]}</button>`:'';
const cxl=(k,o)=>!isR()&&o.st>=0&&o.st<4?`<button class="d" onclick="act('${k}','${o.id}',{st:-1})">إلغاء</button>`:'';
async function lg(){const r=$('#lr').value;signin(r,r=='rest'?val('li'):'',val('lp'));if(await load())draw();else{alert('بيانات الدخول غير صحيحة');logout()}}
function login(){$('#v').innerHTML='<h1>'+(TT[FR]||'لوحة التحكم')+'</h1><div class="card"><select id="lr" '+(FR?'hidden ':'')+' onchange="$(\'#li\').hidden=this.value!=\'rest\'"><option value="admin" '+(FR=='admin'?'selected':'')+'>صاحب التطبيق</option><option value="support" '+(FR=='support'?'selected':'')+'>الدعم والمتابعة</option><option value="rest" '+(FR=='rest'?'selected':'')+'>صاحب مطعم</option></select><input id="li" '+(FR=='rest'?'':'hidden')+' placeholder="رمز المطعم"><input id="lp" type="password" placeholder="الرمز السري"><button class="big" onclick="lg()">دخول</button></div>'}
const stat=()=>{const O=Object.values(DB.orders),R=Object.values(DB.rides),D=Object.values(DB.drivers),a=O.filter(o=>o.st>=0&&o.st<4).length,b=R.filter(o=>o.st>=0&&o.st<4).length,rev=O.filter(o=>o.st==4).reduce((s,o)=>s+o.tot,0)+R.filter(o=>o.st==4).reduce((s,o)=>s+o.fare,0);return `<div class="stats"><div class="stat"><b>${a}</b>طلبات نشطة</div><div class="stat"><b>${b}</b>رحلات نشطة</div><div class="stat"><b>${D.filter(d=>d.on).length} / ${D.length}</b>كباتن متصلون</div><div class="stat"><b>${fmt(rev)}</b>إيرادات منجزة</div><div class="stat"><b>${fmt(O.concat(R).reduce((s,o)=>s+(o.com||0)+(o.rcom||0),0))}</b>عمولات التطبيق</div></div>`};
const mt=u=>/\.(mp4|webm|mov)$/.test(u)?`<video controls playsinline preload="metadata" src="${u}" style="width:100%;border-radius:12px;max-height:240px;margin-top:6px"></video>`:`<a href="${u}" target="_blank"><img src="${u}" alt="" style="width:100%;border-radius:12px;max-height:180px;object-fit:cover;margin-top:6px"></a>`;
const DL={idf:'الهوية (أمام)',idb:'الهوية (خلف)',lic:'إجازة السوق',car1:'السيارة (أمام)',car2:'السيارة (خلف)',car3:'داخل السيارة',v1:'فيديو التعريف',v2:'فيديو السيارة'},TY={delivery:'توصيل طعام',taxi:'تكسي',both:'توصيل وتكسي'},sc=s=>s>0?'s':s<0?'x':'w';
function appT(){return Object.values(DB.apps||{}).sort((a,b)=>b.at-a.at).map(a=>`<div class="card"><div class="row sp"><b>${esc(a.n)}</b><span class="tag ${sc(a.st)}">${a.st>0?'مفعّل':a.st<0?'مرفوض':'بانتظار المراجعة'}</span></div><div class="mu">${TY[a.type]||''} • ${esc(a.ph)} • ${esc(a.city||'')}<br>${esc(a.car)} • لوحة ${esc(a.plate)}</div><div class="stats">${Object.entries(a.docs||{}).map(([k,u])=>`<div class="stat">${DL[k]||k}${mt(u)}</div>`).join('')}</div>${a.st==0?`<div class="bt"><button onclick="appr('${a.id}')">✔ تفعيل الحساب</button><button class="d" onclick="rjc('${a.id}')">رفض</button></div>`:a.st>0?`<div class="mu">رمز الدخول ${esc(a.did)} • السري ${esc(a.pin)}</div>`:`<div class="mu off">${esc(a.why||'')}</div>`}</div>`).join('')||'<p class="mu">لا توجد طلبات.</p>'}
async function appr(id){const a=DB.apps[id],d='d'+Date.now().toString(36),pin=String(crypto.getRandomValues(new Uint32Array(1))[0]%9000+1000);await act('drivers',d,{n:a.n,ph:a.ph,car:a.car+' '+a.plate,type:a.type,pin,on:0});await act('apps',id,{st:1,did:d,pin})}
const rjc=id=>{const w=prompt('سبب الرفض');w&&act('apps',id,{st:-1,why:w})};
function cardT(){return Object.values(DB.cardorders||{}).sort((a,b)=>b.at-a.at).map(m=>`<div class="card"><div class="row sp"><b>${esc(m.cn2)} • ${fmt(m.p)}</b><span class="tag ${sc(m.st)}">${m.st>0?'تم التسليم':m.st<0?'مرفوض':'جديد'}</span></div><div class="mu">${esc(m.cn)} • ${esc(m.cp)}</div>${m.code?`<div class="code">${esc(m.code)}</div>`:''}${m.st==0?`<input id="cd${m.id}" placeholder="${(DB.cards[m.card]||{}).auto?'اتركه فارغًا لتسليم كود تلقائي من المخزون (متوفر '+cSum(m.card).a+')':'كود البطاقة الذي سيراه الزبون'}"><div class="bt"><button onclick="act('cardorders','${m.id}',{st:1,code:val('cd${m.id}')})">تسليم</button><button class="d" onclick="act('cardorders','${m.id}',{st:-1})">رفض</button></div>`:''}</div>`).join('')||'<p class="mu">لا توجد طلبات بطاقات.</p>'}
function offT(){return `<div class="card"><b>إضافة عرض</b><input id="ot" placeholder="عنوان العرض"><input id="od" placeholder="وصف"><input id="op" type="number" placeholder="نسبة الخصم % (للطعام التلقائي، أو للكود)"><select id="oc"><option value="food">طعام</option><option value="taxi">تكسي</option><option value="cards">ديجيتال / بطاقات</option><option value="market">سوبرماركت</option></select><input id="oc2" placeholder="كود الخصم (اختياري — فارغ = خصم تلقائي للطعام)" dir="ltr"><input id="oz" placeholder="مراحل كود التكسي: نسبة:حد أقصى لكل رحلة، مثال 30:1250,30:1250,50:1500" dir="ltr"><select id="or"><option value="">كل المطاعم</option>${Object.values(DB.rests).map(r=>`<option value="${r.id}">${esc(r.n)}</option>`).join('')}</select><button onclick="val('ot')&&(+val('op')||val('oz'))&&act('offers','f'+Date.now().toString(36),{t:val('ot'),d:val('od'),pct:+val('op')||0,rid:$('#or').value,on:1,cat:$('#oc').value,code:val('oc2').trim(),tiers:val('oz').trim()})">إضافة</button></div>`+Object.values(DB.offers||{}).map(o=>`<div class="card row sp"><div><b>${esc(o.t)}</b> <span class="tag s">${o.pct?o.pct+'%':(o.tiers||'')}</span>${o.code?` <span class="tag" dir="ltr">${esc(o.code)}</span>`:''} <span class="mu">${({taxi:'تكسي',cards:'ديجيتال',market:'سوبرماركت'})[o.cat]||'طعام'}</span><div class="mu">${esc(o.d||'')} ${o.rid&&DB.rests[o.rid]?'• '+esc(DB.rests[o.rid].n):'• كل المطاعم'}</div></div><div class="bt"><button class="l" onclick="act('offers','${o.id}',{on:${o.on===0?1:0}})">${o.on===0?'تفعيل':'إيقاف'}</button><button class="d" onclick="del('offers','${o.id}')">حذف</button></div></div>`).join('')}
/* ===== كتالوج البطاقات + مخزون الأكواد التسلسلية ===== */
let ce=null,cw='a',cdat=null,cmsg='',cgen=[];
const KD={card:'بطاقة / لعبة (تُباع)',wallet:'كارت شحن محفظة الزبون',cap:'كارت شحن رصيد الكابتن'};
async function codesApi(b){try{const r=await fetch('/api/codes',{method:'POST',headers:H(),body:JSON.stringify(b)}),j=await r.json().catch(()=>({}));return r.ok?j:{e:j.e||'تعذر تنفيذ العملية'}}catch(e){return{e:'تعذر الاتصال بالسيرفر'}}}
const cSum=id=>((DB.codes||{})[id])||{a:0,s:0};
function cardAdd(){const k=$('#bk').value,o={n:val('bn'),p:+val('bp'),d:val('bd'),cat:val('bcat'),e:val('be')||'💳',kind:k,auto:$('#ba').checked||k!='card'?1:0};if(!o.n||!(o.p>=0)||val('bp')==='')return alert('أدخل اسم البطاقة وسعر البيع');
 if(val('bcost')!=='')o.cost=+val('bcost');if(k!='card'){o.v=+val('bv');if(!(o.v>0))return alert('أدخل قيمة الكارت (المبلغ الذي يُضاف للرصيد)')}act('cards','x'+Date.now().toString(36),o)}
function cardEdit(id){const c=DB.cards[id],p=prompt('سعر البيع (د.ع):',c.p);if(p===null)return;const k=prompt('سعر التكلفة (د.ع) — اتركه فارغًا إن لا توجد:',c.cost==null?'':c.cost);if(k===null)return;const o={p:+p,cost:k.trim()};if(c.kind&&c.kind!='card'){const v=prompt('قيمة الكارت (تُضاف للرصيد):',c.v||'');if(v===null)return;o.v=+v}act('cards',id,o)}
async function codesOpen(id){ce=id;cw='a';cmsg='';cgen=[];cdat=null;draw();await codesLoad()}
async function codesLoad(){const r=await codesApi({op:'list',card:ce,which:cw,limit:300});cdat=r;draw()}
async function codesAdd(){const t=val('cx_t');if(!t)return alert('الصق الأكواد أو اختر ملفًا');const r=await codesApi({op:'add',card:ce,text:t});cmsg=r.e?'⚠️ '+r.e:`✅ أُضيف ${r.add} كود • مكرر ${r.dup} • غير صالح ${r.bad} • المتوفر الآن ${r.avail}`;await load();await codesLoad()}
async function codesGen(){const n=Math.round(+val('cx_n'));if(!(n>0))return alert('أدخل عدد الأكواد');if(!confirm('توليد '+n+' كود جديد؟'))return;const r=await codesApi({op:'gen',card:ce,n});cgen=r.codes||[];cmsg=r.e?'⚠️ '+r.e:`✅ وُلّد ${r.add} كود (انسخها أو صدّرها الآن)`;await load();await codesLoad()}
async function codesDel(c){if(!confirm('حذف هذا الكود من المخزون؟'))return;const r=await codesApi({op:'del',card:ce,code:c});if(r.e)alert(r.e);await load();await codesLoad()}
async function codesClear(){if(!confirm('حذف كل الأكواد المتوفرة لهذه البطاقة؟ لا يمكن التراجع.'))return;const r=await codesApi({op:'clear',card:ce});cmsg=r.e?'⚠️ '+r.e:'تم حذف '+r.removed+' كود';await load();await codesLoad()}
async function codesCsv(){const r=await codesApi({op:'list',card:ce,which:'a',all:1});if(r.e)return alert(r.e);dl('codes-'+ce+'.csv','\ufeff'+'الكود\n'+(r.items||[]).map(x=>'"'+x+'"').join('\n'))}
function dl(name,txt){const b=new Blob([txt],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function codesFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{$('#cx_t').value=String(r.result||'').replace(/^\ufeff/,'');cmsg='تم تحميل الملف — راجع الأكواد ثم اضغط «إضافة الأكواد»';$('#cx_m').textContent=cmsg};r.readAsText(f)}
function codesT(){const c=DB.cards[ce];if(!c){ce=null;return catT()}const m=cSum(ce),items=(cdat&&cdat.items)||[];
 return `<div class="row sp"><button class="l" onclick="ce=null;draw()">رجوع</button><h2 style="margin:0">${esc(c.e||'💳')} ${esc(c.n)}</h2></div>
 <div class="stats"><div class="stat"><b class="on">${m.a}</b>متوفر</div><div class="stat"><b>${m.s}</b>مباع / مستخدم</div><div class="stat"><b>${c.cost!=null&&c.cost!==''?fmt(m.a*c.cost):'—'}</b>قيمة المخزون (تكلفة)</div></div>
 <div class="card"><b>إضافة أكواد</b><div class="mu">كود في كل سطر (أو مفصولة بفاصلة)، حتى 50,000 دفعة واحدة. المكرر يُتجاهل تلقائيًا.</div><textarea id="cx_t" rows="6" placeholder="XXXX-XXXX-XXXX" style="width:100%"></textarea><input type="file" accept=".txt,.csv,text/plain" onchange="codesFile(this.files[0])"><div class="mu" id="cx_m">${esc(cmsg)}</div><button onclick="codesAdd()">إضافة الأكواد</button></div>
 <div class="card"><b>توليد أكواد عشوائية</b><div class="mu">مناسب لكروت شحن المحفظة التي تبيعها بنفسك.</div><div class="row"><input id="cx_n" type="number" placeholder="العدد" value="10" style="flex:1"><button onclick="codesGen()">توليد</button></div>${cgen.length?`<textarea readonly rows="5" style="width:100%" onclick="this.select()">${esc(cgen.join('\n'))}</textarea><button class="l" onclick="dl('new-codes.csv','\\ufeff'+'الكود\\n'+cgen.join('\\n'))">تصدير CSV</button>`:''}</div>
 <div class="tabs" style="position:static;margin:8px 0;padding:0;border:0"><button class="${cw=='a'?'a':''}" onclick="cw='a';codesLoad()">المتوفرة (${m.a})</button><button class="${cw=='s'?'a':''}" onclick="cw='s';codesLoad()">المباعة (${m.s})</button><button class="l" onclick="codesCsv()">تصدير المتوفر</button>${m.a?'<button class="d" onclick="codesClear()">حذف كل المتوفر</button>':''}</div>`+
 (cdat?(cw=='a'?items.map(x=>`<div class="card row sp"><code>${esc(x)}</code><button class="d" onclick="codesDel('${esc(x).replace(/'/g,'')}')">حذف</button></div>`).join(''):items.map(x=>{const u=x.cid?((DB.customers||{})[x.cid]||{}):x.did?((DB.drivers||{})[x.did]||{}):{};return`<div class="card"><div class="row sp"><code>${esc(x.c)}</code><span class="mu">${new Date(x.at).toLocaleString('ar-IQ')}</span></div><div class="mu">${x.red?'استُبدل بالرصيد':'طلب '+esc(x.oid||'')} • ${esc(u.n||x.cid||x.did||'')} ${u.ph?'• '+esc(u.ph):''}</div></div>`}).join('')):'<p class="mu">جارٍ التحميل…</p>')+
 (cdat&&cdat.total>items.length?`<p class="mu">يعرض ${items.length} من ${cdat.total} — استخدم التصدير للقائمة الكاملة.</p>`:'')+(cdat&&!items.length?'<p class="mu">لا توجد أكواد.</p>':'')}
function catT(){if(ce)return codesT();
 return `<div class="card"><b>إضافة بطاقة</b><select id="bk" onchange="$('#bvw').hidden=this.value=='card'">${Object.entries(KD).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
 <input id="bn" placeholder="اسم البطاقة (مثال: ببجي 60 UC، كارت شحن 5,000)"><input id="bp" type="number" placeholder="سعر البيع"><input id="bcost" type="number" placeholder="سعر التكلفة (لحساب الربح — اختياري)">
 <div id="bvw" hidden><input id="bv" type="number" placeholder="قيمة الكارت: المبلغ الذي يُضاف للرصيد عند الاستبدال"></div>
 <input id="bd" placeholder="وصف"><input id="bcat" placeholder="الفئة (مثال: رصيد، ألعاب، خدمات)"><input id="be" placeholder="إيموجي (💳)">
 <label class="row" style="gap:8px;margin:6px 0"><input id="ba" type="checkbox" checked style="width:auto"> تسليم تلقائي فوري من مخزون الأكواد</label><button onclick="cardAdd()">إضافة</button></div>`+
 Object.values(DB.cards||{}).map(c=>{const m=cSum(c.id),kd=c.kind||'card',mg=c.cost!=null&&c.cost!==''?c.p-c.cost:null;return`<div class="card"><div class="row sp"><b>${esc(c.e||'💳')} ${esc(c.n)}</b><span class="tag ${kd=='card'?'':'s'}">${kd=='card'?(c.auto?'تلقائي':'يدوي'):KD[kd]}</span></div>
 <div class="mu">بيع ${fmt(c.p)}${c.cost!=null&&c.cost!==''?' • تكلفة '+fmt(c.cost):''}${mg!=null?' • ربح '+fmt(mg):''}${kd!='card'?' • قيمة '+fmt(c.v):''}${c.cat?' • '+esc(c.cat):''}</div>
 ${c.auto||kd!='card'?`<div class="row sp" style="margin-top:6px"><span class="${m.a?'on':'off'}">${m.a?'متوفر '+m.a:'⚠️ نفد المخزون'}</span><span class="mu">مباع ${m.s}</span></div>`:''}
 <div class="bt" style="margin-top:6px">${c.auto||kd!='card'?`<button onclick="codesOpen('${c.id}')">الأكواد</button>`:''}<button class="l" onclick="cardEdit('${c.id}')">تعديل السعر</button><button class="d" onclick="${m.a?`alert('احذف الأكواد المتوفرة أولًا')`:`del('cards','${c.id}')`}">حذف</button></div></div>`}).join('')}
function ordT(){return isR()?ordR():ordA()}
function ordR(){const L=Object.values(DB.orders).sort((a,b)=>b.at-a.at);return L.map(o=>`<div class="card"><div class="row sp"><b>${esc(o.rn)}</b><span class="tag">${o.st<0?'ملغي':FS[o.st]}</span></div><div>${o.its.map(i=>i.q+' × '+esc(i.n)).join('، ')}</div>${isR()?'':`<div class="mu">${esc(o.cn)} • ${esc(o.cp)} • ${link(o.loc,'موقع الزبون')}<br>${esc(o.note||'')}</div>`}<div class="row sp" style="margin-top:6px"><b>${fmt(o.tot)}</b><div class="bt">${dsel('orders',o)}${cxl('orders',o)}${nxt('orders',o,['قبول وبدء التحضير','جاهز للاستلام','استلمه الكابتن','تم التسليم'],isR()?2:4)}</div></div></div>`).join('')||'<p class="mu">لا توجد طلبات.</p>'}
/* ===================== الرئيسية + طلبات المطاعم (إدارة) ===================== */
const nph=x=>{let p=String(x||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0'))p='964'+p.slice(1);else if(/^7\d{9}$/.test(p))p='964'+p;return/^\d{10,15}$/.test(p)?p:''},
 waU=(ph,t)=>{const n=nph(ph);return n?'https://wa.me/'+n+(t?'?text='+encodeURIComponent(t):''):''},
 waB=(ph,t,l)=>{const u=waU(ph,t);return u?`<a class="btn l" target="_blank" rel="noopener" href="${u}">${l||'💬 واتساب'}</a>`:''},
 telB=(ph,l)=>ph?`<a class="btn l" href="tel:${esc(ph)}">${l||'📞 اتصال'}</a>`:'',
