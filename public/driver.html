<!DOCTYPE html>
<html lang="ar" dir="rtl" data-app="driver"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تكسي المتميز - الكابتن</title>
<link rel="stylesheet" href="shared.css"><script src="config.js"></script><script src="shared.js"></script></head>
<body><div id="app"><div id="dm" class="map" hidden></div><div id="v"></div></div>
<script>
auth('driver');let pos=null,first=1;
navigator.geolocation&&navigator.geolocation.watchPosition(p=>pos={lat:p.coords.latitude,lng:p.coords.longitude},()=>{},{enableHighAccuracy:true});
const me=()=>DB.drivers[AUTH.id]||{};
const rej=(k,id)=>{const o=(k=='orders'?DB.orders:DB.rides)[id];confirm('رفض الطلب؟ سيُحوَّل لأقرب كابتن آخر.')&&act(k,id,{did:null,rej:[...(o.rej||[]),AUTH.id],...(k=='rides'?{st:0}:{})})};
const nv=p=>p?`<a class="btn" target="_blank" href="${nav(p)}">الملاحة في خرائط جوجل</a>`:'';
const km=(a)=>pos&&a?dist(pos,a).toFixed(1)+' كم':'-';
let wo=0,wimg='',wv={a:'',m:'',n:''};
function wallet(bal,mn,blk){const P=DB.cfg.pay||[],T=Object.values(DB.topups||{}).sort((a,b)=>b.at-a.at).slice(0,3),X=Object.values(DB.tx||{}).sort((a,b)=>b.at-a.at).slice(0,4),op=wo||blk;
return `<div class="card" style="${blk?'border-color:var(--rd)':''}"><div class="row sp"><b>💰 رصيد المحفظة</b><b class="${bal<0?'off':'on'}">${fmt(bal)}</b></div>${blk?`<div class="off"><b>⛔ حسابك موقوف</b><div class="mu">وصل رصيدك إلى ${fmt(mn)} أو أقل. اشحن حسابك لتفعيله واستلام الطلبات.</div></div>`:`<div class="mu">يتوقف الحساب تلقائيًا عند ${fmt(mn)}</div>`}${blk?'':`<button class="l" style="margin-top:8px" onclick="wo=!wo;draw()">شحن الرصيد</button>`}${op?`<h3>طرق الشحن</h3><div class="card">📞 تواصل مع الدعم لشحن حسابك، أو حوّل عبر إحدى الطرق التالية وأرفق صورة الوصل:</div>${P.map(p=>`<div class="card"><b>${esc(p.n)}</b><div class="mu" style="white-space:pre-line;user-select:all">${esc(p.d)}</div></div>`).join('')}<input type="number" placeholder="المبلغ المحوَّل (د.ع)" value="${esc(wv.a)}" oninput="wv.a=this.value"><select onchange="wv.m=this.value">${P.map(p=>`<option ${wv.m==p.n?'selected':''}>${esc(p.n)}</option>`).join('')}</select><label class="card up"><span><b>صورة وصل التحويل</b><div class="mu ${wimg?'on':''}">${wimg?'تم الرفع ✓':'اضغط للاختيار'}</div></span><span>📷</span><input type="file" hidden accept="image/*" onchange="wUp(this)"></label><input placeholder="ملاحظة (اختياري)" value="${esc(wv.n)}" oninput="wv.n=this.value"><button class="big" onclick="wSend()">إرسال طلب الشحن</button>`:''}${T.length?'<h3>طلبات الشحن</h3>'+T.map(t=>`<div class="row sp"><span>${fmt(t.amt)} • ${esc(t.m)}</span><span class="tag ${t.st>0?'s':t.st<0?'x':'w'}">${t.st>0?'تم الشحن':t.st<0?'مرفوض':'قيد المراجعة'}</span></div>`).join(''):''}${X.length?'<h3>آخر الحركات</h3>'+X.map(x=>`<div class="row sp mu"><span>${esc(x.why)}</span><b class="${x.amt<0?'off':'on'}">${x.amt>0?'+':''}${fmt(x.amt)}</b></div>`).join(''):''}</div>`}
async function wUp(el){const f=el.files[0];if(!f)return;try{wimg=await upl(f,1400)}catch(e){alert('فشل رفع الصورة، أعد المحاولة')}draw()}
async function wSend(){const a=+wv.a,P=DB.cfg.pay||[];if(!(a>0))return alert('أدخل المبلغ المحوَّل');if(!wimg)return alert('أرفق صورة وصل التحويل');if(!await set('topups','w'+Date.now().toString(36),{did:AUTH.id,amt:a,m:wv.m||(P[0]&&P[0].n)||'',img:wimg,note:wv.n}))return alert('تعذر إرسال الطلب');wv={a:'',m:'',n:''};wimg='';wo=0;alert('تم إرسال طلب الشحن. سيُشحن رصيدك فور مراجعته.');draw()}
async function lg(){signin('driver',$('#li').value.trim(),$('#lp').value.trim());if(await load())draw();else{alert('بيانات الدخول غير صحيحة');logout()}}
function draw(){
if(!AUTH.pin||!DB.drivers[AUTH.id]){$('#dm').hidden=1;return $('#v').innerHTML='<h1>دخول الكابتن</h1><div class="card"><input id="li" placeholder="رمز الكابتن"><input id="lp" type="password" placeholder="الرمز السري"><button class="big" onclick="lg()">دخول</button></div>'}
const m=me(),bal=m.bal||0,mn=DB.cfg.minBal??-15000,blk=bal<=mn,on=!!m.on&&!blk,O=Object.values(DB.orders),R=Object.values(DB.rides),
mo=O.filter(o=>o.did==AUTH.id&&o.st>=1&&o.st<4),mr=R.filter(o=>o.did==AUTH.id&&o.st>=1&&o.st<4),ao=O.filter(o=>!o.did&&o.st==2&&(m.type||'both')!='taxi'&&!(o.rej||[]).includes(AUTH.id)),ar=R.filter(o=>!o.did&&o.st==0&&(m.type||'both')!='delivery'&&!(o.rej||[]).includes(AUTH.id));
let h=`<div class="row sp"><h1>${esc(m.n)}</h1><button class="l" onclick="logout()">خروج</button></div><button ${blk?'hidden ':''}class="big ${on?'':'l'}" onclick="act('drivers','${AUTH.id}',{on:${on?0:1}${pos?',loc:pos':''}})">${on?'متصل • اضغط للإيقاف':'غير متصل • اضغط لبدء استلام الطلبات'}</button>`;
h+=wallet(bal,mn,blk);
const dn=O.filter(o=>o.did==AUTH.id&&o.st==4),dr=R.filter(o=>o.did==AUTH.id&&o.st==4);
h+=`<div class="stats"><div class="stat"><b>${dn.length+dr.length}</b>مشاوير منجزة</div><div class="stat"><b>${fmt(dn.reduce((s,o)=>s+(o.fee||0),0)+dr.reduce((s,o)=>s+(o.fare||0),0))}</b>أرباح التوصيل</div></div>`;
h+=mo.map(o=>`<div class="card"><div class="row sp"><b>🍽️ ${esc(o.rn)}</b>${o.auto?'<span class="tag">تعيين تلقائي</span>':''}<span class="tag">${FS[o.st]}</span></div><div>${o.its.map(i=>i.q+' × '+esc(i.n)).join('، ')}</div><div class="mu">الزبون: ${esc(o.cn)} • <a href="tel:${esc(o.cp)}">${esc(o.cp)}</a><br>${esc(o.note||'')}</div><b>المبلغ المطلوب: ${fmt(o.tot)}</b><div class="bt" style="margin-top:6px">${o.st<3?nv(o.rloc):nv(o.loc)}${o.st<3?`<button class="l" onclick="rej('orders','${o.id}')">رفض</button>`:''}${o.st==1?`<button class="l" disabled>المطعم يجهّز الطلب… توجّه إليه</button>`:`<button onclick="act('orders','${o.id}',{st:${o.st+1}})">${o.st==2?'استلمت من المطعم':'تم التسليم'}</button>`}</div></div>`).join('');
h+=mr.map(o=>`<div class="card"><div class="row sp"><b>🚕 رحلة • ${o.km} كم</b><span class="tag">${RS[o.st]}</span></div><div class="mu">الزبون: ${esc(o.cn)} • <a href="tel:${esc(o.cp)}">${esc(o.cp)}</a></div><b>الأجرة: ${fmt(o.fare)}</b><div class="bt" style="margin-top:6px">${nv(o.st<3?o.from:o.to)}${o.st==1?`<button class="l" onclick="rej('rides','${o.id}')">رفض</button>`:''}<button onclick="act('rides','${o.id}',{st:${o.st+1}})">${['','وصلت للزبون','بدأت الرحلة','إنهاء الرحلة'][o.st]}</button></div></div>`).join('');
if(on){h+='<h2>طلبات متاحة</h2>'+(ao.map(o=>`<div class="card"><div class="row sp"><b>🍽️ ${esc(o.rn)}</b><b>${fmt(o.fee)}</b></div><div class="mu">يبعد المطعم عنك ${km(o.rloc)}</div><button onclick="act('orders','${o.id}',{did:'${AUTH.id}'})">قبول التوصيل</button></div>`).join('')+ar.map(o=>`<div class="card"><div class="row sp"><b>🚕 رحلة • ${o.km} كم</b><b>${fmt(o.fare)}</b></div><div class="mu">الزبون يبعد عنك ${km(o.from)}</div><button onclick="act('rides','${o.id}',{did:'${AUTH.id}',st:1})">قبول الرحلة</button></div>`).join('')||'<p class="mu">لا توجد طلبات حاليًا. ستظهر هنا تلقائيًا.</p>')}
const nn=mo.length+mr.length;if(window._n!=null&&nn>window._n&&navigator.vibrate)navigator.vibrate([300,100,300]);window._n=nn;
$('#v').innerHTML=h;
const pts=[{p:pos,l:'ك',t:'أنت'}];mo.forEach(o=>pts.push(o.st<3?{p:o.rloc,l:'م',t:o.rn}:{p:o.loc,l:'ز',t:o.cn}));mr.forEach(o=>pts.push(o.st<3?{p:o.from,l:'أ',t:o.cn}:{p:o.to,l:'ب',t:'الوجهة'}));
$('#dm').hidden=!(mo.length+mr.length);if(mo.length+mr.length)showMap($('#dm'),pts)}
start(async()=>{if(AUTH.pin&&me().on&&pos)try{await fetch('/api/set',{method:'POST',headers:H(),body:JSON.stringify({k:'drivers',id:AUTH.id,v:{loc:pos}})})}catch(e){}if(first||!busy()){first=0;draw()}});
</script></body></html>
