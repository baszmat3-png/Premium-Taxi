 <div class="st3">${steps.map((s,i)=>`<span class="${i<cur?'d':i==cur?'c':''}">${s}</span>`).join('')}</div>

 <div class="rt"><span class="ln"></span><p><i class="d1"></i><span class="tx">${esc(rd?(o.fa||'نقطة الانطلاق'):o.rn)}</span></p><p><i class="d2"></i><span class="tx">${esc(rd?(o.ta||'الوجهة'):(o.note||'موقع الزبون'))}</span></p></div>${rd&&(o.sn||o.dn2||o.rt2)?'<div class="mu" style="margin-top:6px">'+(o.sn?'🛑 توقف: '+esc(o.sn)+'  ':'')+(o.dn2?'📍 وجهة ثانية: '+esc(o.dn2)+'  ':'')+(o.rt2?'↔ ذهاب وإياب':'')+'</div>':''}
 ${!rd?`<div class="mu">${o.its.map(i=>i.q+' × '+esc(i.n)).join('، ')}<br>${o.paid?'<b class="on">✅ مدفوع بالمحفظة — لا تستلم نقدًا</b>':'المطلوب من الزبون: <b>'+fmt(o.tot)+'</b>'}</div>`:''}

/* ---------- المحفظة والسحب ---------- */
function walletPg(){const m=me(),bal=m.bal||0,mn=DB.cfg.minBal??-15000,blk=bal<=mn,P=DB.cfg.pay||[],W=Object.values(DB.wd||{}).sort((a,b)=>b.at-a.at).slice(0,5),T=Object.values(DB.topups||{}).sort((a,b)=>b.at-a.at).slice(0,3),X=Object.values(DB.tx||{}).sort((a,b)=>b.at-a.at).slice(0,8),pend=W.some(w=>w.st==0),can=bal>=MIN()&&!pend;

function earnPg(){const id=AUTH.id,O=Object.values(DB.orders).filter(o=>o.did==id&&o.st==4),R=Object.values(DB.rides).filter(o=>o.did==id&&o.st==4),
 all=[...O.map(o=>({t:'🍽️ '+o.rn,g:o.fee||0,c:o.com||0,at:o.at})),...R.map(o=>({t:'🚕 رحلة '+(o.km||0)+' كم',g:o.fare||0,c:o.com||0,at:o.at}))].sort((a,b)=>b.at-a.at),
 sm=a=>a.reduce((s,x)=>s+x.g-x.c,0),td=all.filter(x=>tod(x.at)),wk=all.filter(x=>Date.now()-x.at<6048e5);
 return `<div class="row sp"><h1>الأرباح</h1><button class="fab" onclick="pg='';draw()">✕</button></div><div class="stats"><div class="stat"><b>${fmt(sm(td))}</b>أرباح اليوم (${td.length})</div><div class="stat"><b>${fmt(sm(wk))}</b>آخر 7 أيام (${wk.length})</div><div class="stat"><b>${all.length}</b>إجمالي المشاوير</div><div class="stat"><b>${fmt(all.reduce((s,x)=>s+x.c,0))}</b>عمولات التطبيق</div></div>`+all.slice(0,30).map(x=>`<div class="card row sp" style="margin:8px 0"><div><b>${x.t}</b><div class="mu">${hrs(x.at)}</div></div><div style="text-align:left"><b>${fmt(x.g)}</b><div class="mu off">عمولة ${fmt(x.c)}</div></div></div>`).join('')}
function setPg(){const m=me();return `<div class="row sp"><h1>إعدادات الحساب</h1><button class="fab" onclick="pg='';draw()">✕</button></div>
 <div class="card"><label class="row up"><div class="av" style="background-image:url('${esc(pv.img||m.img||'')}')">${pv.img||m.img?'':'👤'}</div><span class="g"><b>تغيير الصورة الشخصية</b><div class="mu">اضغط لاختيار صورة</div></span><input type="file" hidden accept="image/*" onchange="pUp(this)"></label></div>
 <div class="card"><b>🚗 معلومات المركبة</b><input id="pc" placeholder="نوع المركبة وموديلها (Nissan Sunny 2020)" value="${esc(m.car||'')}"><input id="pcl" placeholder="لون المركبة (أبيض)" value="${esc(m.color||'')}"><input id="pl" placeholder="رقم اللوحة" value="${esc(m.plate||'')}"><button class="big" onclick="pSave()">حفظ المعلومات</button></div>
 <div class="card"><label class="row sp"><b>🔔 صوت تنبيه الطلبات الجديدة</b><input type="checkbox" ${snd?'checked':''} onchange="snd=this.checked;localStorage.dsnd=snd?1:0;if(snd)ring(1)"></label><div class="mu">يُشغَّل الصوت عند وصول طلب جديد والتطبيق مفتوح.</div></div><div class="card"><b>🔐 حماية الحساب</b><div class="mu" style="margin:6px 0">${me().tfaOn?'المصادقة الثنائية مفعّلة: لا يمكن الدخول بحسابك بدون رمز من هاتفك.':'فعّل المصادقة الثنائية لحماية رصيدك وأرباحك من الاختراق.'}</div>${me().tfaOn?'<button class="d" onclick="tfaOff()">إيقاف المصادقة الثنائية</button>':'<button class="big" onclick="tfaSetup()">تفعيل المصادقة الثنائية</button>'}</div>
 <button class="l big" onclick="document.querySelector('.tb button').click()">🎨 مظهر التطبيق</button><button class="l big" onclick="logout()">تسجيل الخروج</button>`}
async function pUp(el){const f=el.files[0];if(!f)return;try{const u=await upl(f,700);pv.img=u;await act('drivers',AUTH.id,{img:u})}catch(e){alert('فشل رفع الصورة')}}
const pSave=()=>act('drivers',AUTH.id,{car:$('#pc').value,color:$('#pcl').value,plate:$('#pl').value}).then(()=>alert('تم الحفظ'));
/* ---------- الحوافز والتقييم ---------- */
const myDone=()=>[...Object.values(DB.rides),...Object.values(DB.orders)].filter(o=>o.did==AUTH.id&&o.st==4),
prog=n=>{const f=+n.from||0,t=+n.to||9e15,k=n.kind||'all';return myDone().filter(o=>o.at>=f&&o.at<=t&&(k=='all'||(o.rid?'food':'taxi')==k)).length},
myRate=()=>{const R=myDone().filter(o=>o.rated>0);return R.length?{a:R.reduce((s,o)=>s+o.rated,0)/R.length,n:R.length}:null},
incs=()=>(DB.cfg.inc||[]).filter(n=>n.on!==0),KD={all:'رحلة أو طلب',taxi:'رحلة تكسي',food:'طلب توصيل'},
incSt=n=>{const p=prog(n),w=(DB.incw||{})[n.id+'_'+AUTH.id],now=Date.now();return w?['تم صرف الجائزة','s']:p>=n.trips?['تحقق الهدف — بانتظار الصرف','k']:(+n.to&&now>+n.to)?['انتهت','x']:(+n.from&&now<+n.from)?['لم تبدأ','i']:['جارية','w']};
function incPg(){const I=incs().sort((a,b)=>(+a.to||9e15)-(+b.to||9e15)),rt=myRate();
 return `<div class="row sp"><h1>الحوافز والمسابقات</h1><button class="fab" onclick="pg='';draw()">✕</button></div>${rt?`<div class="card row sp"><b>⭐ تقييمك من الزبائن</b><b>${rt.a.toFixed(1)} <span class="mu">(${rt.n})</span></b></div>`:''}`+(I.map(n=>{const p=prog(n),pc=Math.min(100,Math.round(p/n.trips*100)),s=incSt(n);
 return `<div class="card"><div class="row sp"><b>🏆 ${esc(n.n)}</b><span class="tag ${s[1]}">${s[0]}</span></div><div class="mu">أكمل ${n.trips} ${KD[n.kind||'all']} واربح <b>${fmt(n.amt)}</b>${+n.from?'<br>تبدأ: '+new Date(+n.from).toLocaleString('ar-IQ'):''}${+n.to?'<br>تنتهي: '+new Date(+n.to).toLocaleString('ar-IQ'):''}</div><div class="pbar"><i style="width:${pc}%"></i></div><div class="row sp"><b>${p} / ${n.trips}</b><span class="mu">${pc}%</span></div></div>`}).join('')||'<p class="mu">لا توجد مسابقات حالياً.</p>')}
function incMini(){const n=incs().filter(n=>!(+n.to&&Date.now()>+n.to)&&!(+n.from&&Date.now()<+n.from)&&!(DB.incw||{})[n.id+'_'+AUTH.id])[0];if(!n)return'';const p=prog(n),pc=Math.min(100,Math.round(p/n.trips*100));return `<div class="card" style="margin:8px 0" onclick="pg='inc';draw()"><div class="row sp"><b>🏆 ${esc(n.n)}</b><b>${p} / ${n.trips}</b></div><div class="pbar"><i style="width:${pc}%"></i></div><div class="mu">الجائزة ${fmt(n.amt)}${+n.to?' • تنتهي '+new Date(+n.to).toLocaleDateString('ar-IQ'):''}</div></div>`}
/* ---------- القائمة الجانبية ---------- */
function drawer(){const m=me();return `<div class="dr" onclick="if(event.target==this){menu=0;draw()}"><div><div class="row" style="padding:0 22px 18px"><div class="av" style="background-image:url('${esc(m.img||'')}')">${m.img?'':'👤'}</div><div class="g"><b style="font-size:19px">${esc(m.n)}</b><div class="mu">${esc(m.ph||'')}</div><div class="mu">${esc(m.car||'')} ${esc(m.plate||'')}</div>${myRate()?`<div class="mu">⭐ ${myRate().a.toFixed(1)} (${myRate().n} تقييم)</div>`:''}</div></div>
 ${[['💰','المحفظة والسحب','wallet','الرصيد: '+fmt(m.bal||0)],['📈','الأرباح والمشاوير','earn',''],['🏆','الحوافز والمسابقات','inc',incs().length?incs().length+' مسابقة':''],['⚙️','إعدادات الحساب','set','الصورة والمركبة'],['🔔','صوت الطلبات','snd',snd?'مفعّل':'متوقف']].map(x=>`<div class="mi" onclick="${x[2]=='snd'?`snd=!snd;localStorage.dsnd=snd?1:0;if(snd)ring(1)`:`pg='${x[2]}';menu=0`};draw()"><span>${x[0]}</span><div><div>${x[1]}</div><div class="mu">${x[3]}</div></div></div>`).join('')}
 <div class="mi" onclick="document.querySelector('.tb button').click()"><span>🎨</span>مظهر التطبيق</div><div class="mi" onclick="logout()"><span>🚪</span>تسجيل الخروج</div></div></div>`}
/* ---------- الخريطة ---------- */
function mapUpd(){if(!AUTH.pin||!DB.drivers[AUTH.id]||pg)return;const J=jobs(),a=J.mine[0],s=J.av.find(j=>j.o.id==sel);let pts=[{p:pos,l:'ك',t:'أنت'}],route=0;
 if(a){const o=a.o,rd=a.k=='rides',st=o.st;pts.push(rd?(st<3?{p:o.from,l:'أ'}:{p:o.to,l:'ب'}):(st<3?{p:o.rloc,l:'م'}:{p:o.loc,l:'ز'}));route=1}
 else if(s){pts.push({p:P1(s),l:s.k=='rides'?'أ':'م'},{p:P2(s),l:s.k=='rides'?'ب':'ز'});route=1}
 if(!pts.some(x=>x.p))pts=[{p:BG,l:'ك'}];
 const el=$('#dm'),bs=document.querySelector('.bs');el.hidden=0;
 showMap(el,pts,{route,pb:bs?bs.offsetHeight:200,pt:80,onRoute:R=>{const k=JSON.stringify(R.map(r=>r&&[+r.km.toFixed(1),r.min]));if(k==mapK)return;mapK=k;if(a)rt.act=R[0]?{km:R[0].km,min:R[0].min}:null;else if(s&&R[0])rt[s.o.id]={km:R[0].km,min:R[0].min}}})}
/* ---------- الشاشة الرئيسية ---------- */
async function lg(){const id=$('#li').value.trim(),pin=$('#lp').value.trim(),c=$('#lc');try{const r=await fetch('/api/driver/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,pin,code:c?c.value.trim():''})}),j=await r.json().catch(()=>({}));
 if(j.need2fa){if(!$('#lc')){const i=document.createElement('input');i.id='lc';i.placeholder='رمز المصادقة (6 أرقام)';i.inputMode='numeric';i.maxLength=6;$('#lp').after(i);i.focus()}return}
 if(!r.ok||!j.token)return alert(j.e||'بيانات الدخول غير صحيحة');
 signin('driver',id,pin);AUTH.token=j.token;localStorage[KEY]=JSON.stringify(AUTH);if(await load())draw();else{alert('بيانات الدخول غير صحيحة');logout()}}catch(e){alert('تعذر الاتصال بالسيرفر')}}
/* ---------- المصادقة الثنائية ---------- */
async function tfa(a,code){const r=await fetch('/api/driver/2fa',{method:'POST',headers:H(),body:JSON.stringify({a,code})});return[r.ok,await r.json().catch(()=>({}))]}
async function tfaSetup(){const[o,j]=await tfa('setup');if(!o)return alert(j.e||'تعذر البدء');const s=document.createElement('div');s.className='sheet';
 s.innerHTML=`<div style="max-height:92vh;overflow:auto"><b style="font-size:18px">🔐 تفعيل المصادقة الثنائية</b><div class="mu" style="margin:8px 0">1) ثبّت تطبيق Google Authenticator أو Microsoft Authenticator أو Authy.<br>2) أضف حسابًا جديدًا بإدخال هذا المفتاح يدويًا (أو اضغط الرابط):</div><div class="card" style="direction:ltr;text-align:center;font-weight:800;letter-spacing:2px;user-select:all;word-break:break-all">${esc(j.secret)}</div><a class="btn" href="${esc(j.uri)}">فتح في تطبيق المصادقة</a><div class="mu" style="margin-top:8px">3) اكتب الرمز المكوّن من 6 أرقام الظاهر في التطبيق:</div><input id="tc" inputmode="numeric" maxlength="6" placeholder="000000"><div style="display:flex;gap:8px;margin-top:8px"><button class="go" style="flex:1">تفعيل</button><button class="l cl">إلغاء</button></div></div>`;
 s.querySelector('.cl').onclick=()=>s.remove();s.onclick=e=>{if(e.target==s)s.remove()};
 s.querySelector('.go').onclick=async()=>{const[ok,k]=await tfa('enable',s.querySelector('#tc').value);if(!ok)return alert(k.e||'الرمز غير صحيح');AUTH.token=k.token;localStorage[KEY]=JSON.stringify(AUTH);s.remove();await load();draw();alert('تم تفعيل المصادقة الثنائية ✔\nستحتاج الرمز عند كل تسجيل دخول جديد.')};document.body.appendChild(s)}
async function tfaOff(){const c=prompt('أدخل رمز المصادقة الحالي لإيقاف الحماية');if(!c)return;const[ok,j]=await tfa('disable',c);if(!ok)return alert(j.e||'الرمز غير صحيح');delete AUTH.token;localStorage[KEY]=JSON.stringify(AUTH);await load();draw()}
function draw(){
 if(!AUTH.pin||!DB.drivers[AUTH.id]){$('#dm').hidden=1;return $('#v').innerHTML='<div style="padding:12vh 20px;max-width:440px;margin:auto"><div style="font-size:60px;text-align:center">🚕</div><h1 style="text-align:center">دخول الكابتن</h1><div class="card"><input id="li" placeholder="رمز الكابتن"><input id="lp" type="password" placeholder="الرمز السري"><button class="big" onclick="lg()">دخول</button></div></div>'}
 const m=me(),bal=m.bal||0,mn=DB.cfg.minBal??-15000,blk=bal<=mn,on=!!m.on&&!blk,J=jobs();
 if(pg){$('#dm').hidden=1;$('#v').innerHTML=`<div class="full"><div>${({wallet:walletPg,earn:earnPg,set:setPg,inc:incPg})[pg]()}</div></div>`;return}
 const ids=J.av.map(j=>j.o.id);if(known===null)known=new Set(ids);else{const nw=ids.filter(i=>!known.has(i));if(nw.length&&on&&snd&&!J.mine.length)ring(3);ids.forEach(i=>known.add(i))}
 const a=J.mine[0];if(!a&&J.av.length&&!J.av.some(j=>j.o.id==sel))sel=J.av[0].o.id;if(!J.av.length||a)sel=null;
 const nn=J.mine.length;if(window._n!=null&&nn>window._n&&snd)ring(1);window._n=nn;
 const td=[...Object.values(DB.orders),...Object.values(DB.rides)].filter(o=>o.did==AUTH.id&&o.st==4&&tod(o.at)),earn=td.reduce((s,o)=>s+(o.fee||o.fare||0)-(o.com||0),0),
 st=`<div class="stats"><div class="stat"><b>${td.length}</b>مشاوير اليوم</div><div class="stat"><b>${fmt(earn)}</b>أرباح اليوم</div></div>${incMini()}`;
 let h=`<div class="top"><button class="fab" onclick="menu=1;draw()">☰</button><div class="pw ${on?'on':''}" ${blk?'style="opacity:.6"':''} onclick="${blk?"pg='wallet';draw()":`act('drivers','${AUTH.id}',{on:${on?0:1}${pos?',loc:pos':''}})`}"><span>${blk?'موقوف':on?'متصل':'غير متصل'}</span><i></i></div><button class="fab" onclick="pg='wallet';draw()">💰</button></div><div class="bs"><i class="grip"></i>`;
 if(blk)h+=`<div class="off"><b>⛔ حسابك موقوف</b><div class="mu">وصل رصيدك إلى ${fmt(mn)} أو أقل. اشحن رصيدك لاستلام الطلبات.</div></div><button class="big" onclick="pg='wallet';draw()">شحن الرصيد</button>`;
 else if(a)h+=active(a);
 else if(!on)h+=`<div style="text-align:center;padding:6px 0 4px"><b style="font-size:20px">أنت غير متصل</b><div class="mu">فعّل زر الاتصال بالأعلى لبدء استلام الطلبات</div></div>${st}<button class="big" onclick="act('drivers','${AUTH.id}',{on:1${pos?',loc:pos':''}})">ابدأ استلام الطلبات</button>`;
 else if(!J.av.length)h+=`<div style="text-align:center"><div class="radar"></div><b style="font-size:19px">بانتظار الطلبات…</b><div class="mu">ستظهر الطلبات القريبة هنا مع صوت تنبيه</div></div>${st}`;
 else h+=`<div class="row sp"><b>طلبات متاحة (${J.av.length})</b><span class="mu">اسحب للتنقل بين الطلبات ↔</span></div><div class="rq" id="rq">${J.av.map((j,i)=>card(j,i,J.av.length)).join('')}</div>`;
 $('#v').innerHTML=h+'</div>'+(menu?drawer():'');
 const q=$('#rq');if(q)q.onscroll=()=>{clearTimeout(q._t);q._t=setTimeout(()=>{const c=[...q.children],mid=q.getBoundingClientRect().left+q.clientWidth/2;let b=c[0],bd=1e9;c.forEach(x=>{const r=x.getBoundingClientRect(),d=Math.abs(r.left+r.width/2-mid);if(d<bd){bd=d;b=x}});if(b&&b.dataset.i!=sel){sel=b.dataset.i;c.forEach(x=>x.classList.toggle('sel',x==b));mapUpd()}},120)};
 mapUpd()}
setInterval(()=>{try{if(AUTH.pin&&DB.drivers[AUTH.id]&&me().on&&pos&&jobs().mine.length)fetch('/api/set',{method:'POST',headers:H(),body:JSON.stringify({k:'drivers',id:AUTH.id,v:{loc:pos}})}).catch(()=>{})}catch(e){}},4000);
start(async ch=>{if(AUTH.pin&&me().on&&pos)try{await fetch('/api/set',{method:'POST',headers:H(),body:JSON.stringify({k:'drivers',id:AUTH.id,v:{loc:pos}})})}catch(e){}if(first||(ch&&!busy())){first=0;draw()}});
</script></body></html>
