name: Build Play Store AAB
on: {workflow_dispatch: {}, push: {tags: ['v*']}}
jobs:
  aab:
    runs-on: ubuntu-24.04
    strategy: {fail-fast: false, matrix: {app: [customer, captain, restaurant, restpos]}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
      - name: Build signed AAB
        run: ./mobile/build-aab.sh ${{ matrix.app }}
        env:
          SERVER_URL: ${{ secrets.SERVER_URL || 'https://premium-taxi.onrender.com' }}
          KS_FILE: ${{ runner.temp }}/upload-key.jks
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: upload
          VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: {name: 'aab-${{ matrix.app }}', path: dist/*.aab}
