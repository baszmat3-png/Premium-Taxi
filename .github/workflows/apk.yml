name: Build APKs
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/apk.yml']
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-24.04
    strategy: {fail-fast: false, matrix: {app: [customer, captain, restaurant, restpos, owner, support]}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - run: ./mobile/build-aab.sh ${{ matrix.app }}
        env: {MODE: apk, SERVER_URL: "${{ secrets.SERVER_URL || 'https://premium-taxi.onrender.com' }}", VERSION_CODE: '${{ github.run_number }}'}
      - uses: actions/upload-artifact@v4
        with: {name: 'apk-${{ matrix.app }}', path: dist/*.apk}
  release:
    needs: apk
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with: {path: out, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 'تطبيقات تكسي المتميز (APK)'
          body: 'آخر نسخ APK للتثبيت المباشر — بُنيت تلقائياً'
          make_latest: true
          files: out/*.apk
          fail_on_unmatched_files: false
