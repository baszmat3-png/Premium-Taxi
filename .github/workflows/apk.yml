name: Build APKs
on: {workflow_dispatch: {}, push: {tags: ['v*']}}
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy: {matrix: {app: [customer, captain, owner, support, restaurant, restpos]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - run: ./mobile/build-apk.sh ${{ matrix.app }}
        env: {SERVER_URL: '${{ secrets.SERVER_URL }}'}
      - uses: actions/upload-artifact@v4
        with: {name: 'taxi-mutamayyiz-${{ matrix.app }}', path: dist/*.apk}
